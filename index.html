<title>Anniv Charlotte &amp; Antoine</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF2EA; --card:#FFFFFF; --ink:#3A2430; --muted:#97707F;
  --line:#EEDCD2; --accent:#CE4877; --accent-ink:#FFFFFF;
  --charlotte:#CE4877; --antoine:#3B7FA8; --deux:#8A63B8;
  --chip:#F6E7DC;
  --shadow:0 1px 2px rgba(58,36,48,.06),0 10px 28px rgba(58,36,48,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241922; --card:#31222E; --ink:#F6EAEF; --muted:#C29DAD;
    --line:#4A3543; --accent:#E76F9B; --accent-ink:#2A1017;
    --charlotte:#E76F9B; --antoine:#6FB2D8; --deux:#B18BE0;
    --chip:#3D2C3A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#241922; --card:#31222E; --ink:#F6EAEF; --muted:#C29DAD;
  --line:#4A3543; --accent:#E76F9B; --accent-ink:#2A1017;
  --charlotte:#E76F9B; --antoine:#6FB2D8; --deux:#B18BE0;
  --chip:#3D2C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
body{background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--charlotte) 0 44px,var(--deux) 44px 88px,var(--antoine) 88px 132px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  max-width:440px;text-align:center;padding:36px 28px;display:flex;flex-direction:column;gap:14px;align-items:center}
.eyebrow{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
h1{font-family:"Baloo 2","Figtree",system-ui,sans-serif;font-weight:800;font-size:1.9rem;line-height:1.1}
h1 .amp{color:var(--accent);font-style:italic}
p{color:var(--muted);font-size:.95rem;max-width:38ch}
.go{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:14px;
  padding:14px 26px;font-family:"Baloo 2","Figtree",sans-serif;font-weight:700;font-size:1.1rem;
  text-decoration:none;margin-top:6px;transition:filter .15s}
.go:hover{filter:brightness(1.07)}
.note{font-size:.82rem}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Figtree:wght@400;600&display=swap">
<main class="card">
  <p class="eyebrow">Samedi 17 octobre</p>
  <h1>Anniv Charlotte <span class="amp">&amp;</span> Antoine</h1>
  <p>La liste des invité·es a déménagé sur une nouvelle page, sans connexion requise : clique ci-dessous pour dire si tu viens.</p>
  <a class="go" href="https://script.google.com/macros/s/AKfycbwlq10UpCDzz_Vaqm8I1HJqHnanfGDPpHeeKAfP_D_KsSSku-EtjW37UBa-IazYy-2x_w/exec">Ouvrir la liste des invité·es</a>
  <p class="note">Pense à mettre le nouveau lien de côté — c'est lui qui compte désormais 🎉</p>
</main>
