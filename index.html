const PARTY = { y: 2026, m: 9, d: 17, label: "Samedi 17 octobre" };

const CAMPS = {
  charlotte: { short: "Copine/copain de Charlotte", cls: "c-charlotte" },
  antoine:   { short: "Copine/copain d'Antoine",    cls: "c-antoine" },
  deux:      { short: "Les deux",                   cls: "c-deux" }
};
const STATUSES = { oui: "Oui", peutetre: "Peut-être", non: "Non" };
const BIG_STATUSES = { oui: "Présent·e ✓", peutetre: "Peut-être", non: "Absent·e" };
const PILLS = { oui: "Présent·e", peutetre: "Peut-être", non: "Absent·e" };

let state = readState();
let artifact = null;
let artifactKnown = false;
let readOnly = false;
let saving = false;
let view = "moi";
let isAdmin = false;
let adminOpen = false;
let editingId = null;
let armedDeleteId = null;
let armedTimer = null;
let draftName = "";
let draftCamp = "charlotte";
let joinName = "";
let joinCamp = "charlotte";
let meId = null;

function readState() {
  try {
    const raw = JSON.parse(document.getElementById("state").textContent);
    if (raw && Array.isArray(raw.guests)) {
      raw.guests = raw.guests.filter(function (g) { return g && typeof g.name === "string"; });
      if (typeof raw.adminHash !== "string" || raw.adminHash.length !== 64) raw.adminHash = DEFAULT_ADMIN_HASH;
      return raw;
    }
  } catch (e) {}
  return { guests: [], adminHash: DEFAULT_ADMIN_HASH, updated: null };
}

(function injectHead() {
  document.title = TITLE_TEXT;
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = FONTS_HREF;
  document.head.appendChild(link);
  const style = document.createElement("style");
  style.textContent = CSS;
  document.head.appendChild(style);
})();

const artifactReady = (window.claude && window.claude.use)
  ? window.claude.use("artifact")
  : Promise.resolve(null);
artifactReady.then(function (ns) {
  artifact = ns;
  artifactKnown = true;
  render();
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function norm(s) {
  return String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

async function sha256(text) {
  if (!(window.crypto && crypto.subtle)) return null;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
}

function getMe() {
  try { return localStorage.getItem("anniv-me"); } catch (e) { return null; }
}
function setMe(id) {
  meId = id;
  try {
    if (id) localStorage.setItem("anniv-me", id);
    else localStorage.removeItem("anniv-me");
  } catch (e) {}
}
function getAdminToken() {
  try { return localStorage.getItem("anniv-admin-h"); } catch (e) { return null; }
}
function setAdminToken(hash) {
  try {
    if (hash) localStorage.setItem("anniv-admin-h", hash);
    else localStorage.removeItem("anniv-admin-h");
  } catch (e) {}
}

function buildDocument(next) {
  const json = JSON.stringify(next).replace(/</g, "\\u003c");
  return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<title>Anniv Charlotte &amp; Antoine</title>\n</head>\n<body>\n' +
    '<div id="app"></div>\n' +
    '<script type="application/json" id="state">' + json + '<\/script>\n' +
    '<script>' + SRC + '<\/script>\n' +
    '</body>\n</html>';
}

function daysLeft() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(PARTY.y, PARTY.m, PARTY.d) - today) / 86400000);
}

function fmtUpdated(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) +
      " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return ""; }
}

function overlay(msg) {
  hideOverlay();
  const el = document.createElement("div");
  el.className = "overlay";
  el.id = "overlay";
  const inner = document.createElement("div");
  inner.textContent = msg;
  el.appendChild(inner);
  document.body.appendChild(el);
}
function hideOverlay() {
  const el = document.getElementById("overlay");
  if (el) el.remove();
}
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 4500);
}

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function save(mutate) {
  if (saving) return;
  const next = JSON.parse(JSON.stringify(state));
  if (mutate(next) === false) return;
  next.updated = new Date().toISOString();
  const art = artifact || (await artifactReady);
  if (!art) {
    toast("Impossible d'enregistrer ici — ouvre la page via le lien partagé sur claude.ai.");
    return;
  }
  saving = true;
  state = next;
  editingId = null;
  armedDeleteId = null;
  render();
  overlay("Enregistrement…");
  try {
    sessionStorage.setItem("anniv-draft", JSON.stringify({ name: draftName, camp: draftCamp }));
    sessionStorage.setItem("anniv-view", view);
  } catch (e) {}
  try {
    await art.publish(buildDocument(next));
    overlay("Enregistré — mise à jour…");
  } catch (err) {
    const code = err && err.code;
    if (code === "conflict") {
      overlay("Quelqu'un vient de modifier la liste — rechargement…");
      return;
    }
    if (code === "upstream_error") {
      try {
        await new Promise(function (r) { setTimeout(r, 600 + Math.random() * 900); });
        await art.publish(buildDocument(next));
        overlay("Enregistré — mise à jour…");
        return;
      } catch (err2) { err = err2; }
    }
    saving = false;
    hideOverlay();
    state = readState();
    if (meId && !state.guests.some(function (x) { return x.id === meId; })) setMe(null);
    const c2 = err && err.code;
    if (c2 === "conflict") { overlay("Quelqu'un vient de modifier la liste — rechargement…"); return; }
    if (c2 === "not_writer" || c2 === "not_granted" || c2 === "not_declared" ||
        c2 === "consent_required" || c2 === "capability_disabled" || c2 === "capability_removed") {
      readOnly = true;
      render();
      toast("Réponse non enregistrée : connecte-toi à claude.ai (gratuit) puis réessaie — ou envoie ta réponse dans le groupe WhatsApp.");
    } else if (c2 === "rate_limited") {
      render();
      toast("Trop de modifications d'un coup — attends quelques secondes et réessaie.");
    } else {
      render();
      toast("L'enregistrement a échoué — réessaie.");
    }
  }
}

function counts() {
  const g = state.guests;
  function n(f) { return g.filter(f).length; }
  return {
    oui: n(function (x) { return x.status === "oui"; }),
    peutetre: n(function (x) { return x.status === "peutetre"; }),
    charlotte: n(function (x) { return x.status !== "non" && (x.camp === "charlotte" || x.camp === "deux"); }),
    antoine: n(function (x) { return x.status !== "non" && (x.camp === "antoine" || x.camp === "deux"); })
  };
}

function campSegHtml(action, current) {
  let html = '<div class="campseg" role="group" aria-label="Copain de qui ?">';
  ["charlotte", "antoine", "deux"].forEach(function (k) {
    const lbl = k === "charlotte" ? "Charlotte" : k === "antoine" ? "Antoine" : "Les deux";
    html += '<button type="button" class="' + CAMPS[k].cls + '" data-act="' + action +
      '" data-camp="' + k + '" aria-pressed="' + (current === k) + '">' + lbl + "</button>";
  });
  return html + "</div>";
}

function renderMe(canWrite) {
  const me = meId ? state.guests.find(function (g) { return g.id === meId; }) : null;
  let html = "";

  if (me) {
    const camp = CAMPS[me.camp] || CAMPS.deux;
    html += '<section class="mecard card">';
    html += '<div><p class="melabel">C’est toi :</p>';
    html += '<p class="mename">' + esc(me.name) + '</p>';
    html += '<p class="mecamp ' + camp.cls + '">' + camp.short + "</p></div>";
    html += '<div><p class="melabel">Tu viens le 17 octobre ?</p>';
    html += '<div class="bigseg" style="margin-top:8px">';
    Object.keys(BIG_STATUSES).forEach(function (s) {
      html += '<button type="button" class="b-' + s + '" data-act="me-status" data-status="' + s +
        '" aria-pressed="' + (me.status === s) + '"' + (canWrite ? "" : " disabled") + ">" +
        BIG_STATUSES[s] + "</button>";
    });
    html += "</div></div>";
    if (canWrite) {
      html += '<div><p class="melabel" style="margin-bottom:8px">Tu es plutôt…</p>' + campSegHtml("me-camp", me.camp) + "</div>";
    }
    html += '<button type="button" class="linkbtn" data-act="not-me">Ce n’est pas moi</button>';
    html += "</section>";
    return html;
  }

  const q = norm(joinName);
  const ready = q.length >= 2;
  const matches = ready ? state.guests.filter(function (g) {
    return norm(g.name).indexOf(q) !== -1;
  }) : [];

  html += '<form class="mecard card" data-form="join">';
  html += '<div><label class="melabel" for="join-name" style="display:block;margin-bottom:6px">Ton prénom</label>';
  html += '<input type="text" id="join-name" maxlength="60" placeholder="Écris ton prénom…" autocomplete="off" value="' + esc(joinName) + '">';
  if (!ready) {
    html += '<p class="hint">' + (q.length === 1
      ? "Encore une lettre ou deux…"
      : "Écris les premières lettres de ton prénom : ton nom apparaîtra s’il est déjà dans la liste.") + "</p>";
  }
  html += "</div>";
  if (ready) {
    if (matches.length) {
      html += '<div><p class="melabel" style="margin-bottom:8px">C’est toi ? Clique sur ton nom :</p>';
      html += '<div class="chips">';
      matches.forEach(function (g) {
        html += '<button type="button" data-act="pick-me" data-id="' + esc(g.id) + '">' + esc(g.name) + "</button>";
      });
      html += "</div></div>";
    }
    if (canWrite) {
      html += '<div class="joinnew">';
      html += '<p class="melabel">' + (matches.length
        ? "Pas dans la liste ? Ajoute-toi — tu es plutôt…"
        : "Ton nom n’est pas encore dans la liste — ajoute-toi ! Tu es plutôt…") + "</p>";
      html += campSegHtml("join-camp", joinCamp);
      html += '<button type="submit" class="go">Je m’ajoute comme « ' + esc(joinName.trim()) + ' »</button>';
      html += "</div>";
    }
  }
  html += "</form>";
  return html;
}

function renderListe(adminEdit) {
  let html = "";
  if (adminEdit) {
    html += '<form class="add card" data-form="add">';
    html += '<label for="guest-name">Ajouter quelqu’un</label>';
    html += '<input type="text" id="guest-name" maxlength="60" placeholder="Prénom (et nom si besoin)" autocomplete="off" value="' + esc(draftName) + '">';
    html += campSegHtml("camp", draftCamp);
    html += '<button type="submit" class="go">Ajouter à la liste</button>';
    html += "</form>";
  }

  html += '<div class="listhead"><h2>Les invité·es</h2><span>' +
    state.guests.length + (state.guests.length > 1 ? " personnes" : " personne") + "</span></div>";

  if (!state.guests.length) {
    html += '<div class="card empty"><b>Personne pour l’instant</b>La liste se remplit bientôt !</div>';
  } else {
    html += '<ul class="guests">';
    state.guests.forEach(function (g) {
      const camp = CAMPS[g.camp] || CAMPS.deux;
      html += '<li class="guest card" data-id="' + esc(g.id) + '">';
      if (editingId === g.id && adminEdit) {
        html += '<form class="editrow" data-form="rename" data-id="' + esc(g.id) + '">';
        html += '<input type="text" maxlength="60" value="' + esc(g.name) + '" aria-label="Nouveau nom" data-edit-input>';
        html += '<button type="submit" class="ok">OK</button>';
        html += '<button type="button" class="no" data-act="cancel-edit">Annuler</button>';
        html += "</form>";
      } else {
        html += '<div class="gwho"><div class="gname">' + esc(g.name) +
          (g.id === meId ? " (toi)" : "") + '</div>' +
          '<div class="gcamp ' + camp.cls + '">' + camp.short + "</div></div>";
        if (adminEdit) {
          html += '<div class="seg" role="group" aria-label="Statut de ' + esc(g.name) + '">';
          Object.keys(STATUSES).forEach(function (s) {
            html += '<button type="button" class="s-' + s + '" data-act="status" data-id="' + esc(g.id) +
              '" data-status="' + s + '" aria-pressed="' + (g.status === s) + '">' + STATUSES[s] + "</button>";
          });
          html += "</div>";
          html += '<div class="gtools">';
          html += '<button type="button" data-act="edit" data-id="' + esc(g.id) + '" aria-label="Renommer ' + esc(g.name) + '">✎</button>';
          if (armedDeleteId === g.id) {
            html += '<button type="button" class="armed" data-act="del" data-id="' + esc(g.id) + '">Supprimer ?</button>';
          } else {
            html += '<button type="button" data-act="del" data-id="' + esc(g.id) + '" aria-label="Supprimer ' + esc(g.name) + '">×</button>';
          }
          html += "</div>";
        } else {
          const st = PILLS[g.status] ? g.status : "peutetre";
          html += '<span class="pill p-' + st + '"><span class="dot dot-' +
            (st === "oui" ? "ok" : st === "peutetre" ? "maybe" : "off") + '"></span>' + PILLS[st] + "</span>";
        }
      }
      html += "</li>";
    });
    html += "</ul>";
  }
  return html;
}

function render() {
  const app = document.getElementById("app");
  const c = counts();
  const dl = daysLeft();
  const jchip = dl > 0 ? "J‑" + dl
    : dl === 0 ? "C'est aujourd'hui !"
    : "";
  const canWrite = !readOnly && (!artifactKnown || artifact);
  const adminEdit = isAdmin && canWrite;

  let html = '<main class="wrap">';
  html += '<header class="hero">';
  html += '<p class="eyebrow"><span>' + PARTY.label + "</span>" +
    (jchip ? '<span class="jchip">' + jchip + "</span>" : "") + "</p>";
  html += '<h1>Anniv Charlotte <span class="amp">&amp;</span> Antoine</h1>';
  html += '<p class="sub">Clique sur ton nom (ou ajoute-toi) et dis-nous si tu viens — tout s’enregistre pour tout le monde.</p>';
  html += "</header>";

  if (readOnly) {
    html += '<p class="banner">Impossible d’enregistrer depuis cet appareil : connecte-toi à claude.ai (gratuit, bouton en haut de la page) puis recharge — ou envoie simplement ta réponse dans le groupe WhatsApp, les organisateurs la noteront.</p>';
  } else if (isAdmin) {
    html += '<p class="banner admin">Mode organisateurs actif — tu peux tout modifier depuis l’onglet « La liste ».</p>';
  }

  html += '<section class="stats" aria-label="Compteurs">';
  html += '<span class="stat"><span class="dot dot-ok"></span><b>' + c.oui + "</b>&nbsp;présent·es</span>";
  html += '<span class="stat"><span class="dot dot-maybe"></span><b>' + c.peutetre + "</b>&nbsp;peut-être</span>";
  html += '<span class="stat"><span class="dot dot-charlotte"></span><b>' + c.charlotte + "</b>&nbsp;côté Charlotte</span>";
  html += '<span class="stat"><span class="dot dot-antoine"></span><b>' + c.antoine + "</b>&nbsp;côté Antoine</span>";
  html += "</section>";

  html += '<nav class="tabs" aria-label="Vues">';
  html += '<button type="button" data-act="tab" data-view="moi" aria-pressed="' + (view === "moi") + '">Moi</button>';
  html += '<button type="button" data-act="tab" data-view="liste" aria-pressed="' + (view === "liste") + '">La liste</button>';
  html += "</nav>";

  html += view === "moi" ? renderMe(canWrite) : renderListe(adminEdit);

  html += '<footer class="foot">';
  if (state.updated) html += "<span>Dernière mise à jour le " + esc(fmtUpdated(state.updated)) + "</span>";
  html += "<span>Rendez-vous le 17 octobre \u{1F389}</span>";
  if (isAdmin) {
    html += '<form class="adminbox" data-form="code">';
    html += '<input type="password" id="admin-newcode" minlength="4" maxlength="40" placeholder="Nouveau code organisateurs" autocomplete="new-password">';
    html += '<button type="submit">Changer le code</button>';
    html += '<button type="button" class="quiet" data-act="admin-off">Quitter le mode organisateurs</button>';
    html += "</form>";
  } else if (adminOpen) {
    html += '<form class="adminbox" data-form="unlock">';
    html += '<input type="password" id="admin-code" maxlength="40" placeholder="Code organisateurs" autocomplete="off" autofocus>';
    html += '<button type="submit">Entrer</button>';
    html += '<button type="button" class="quiet" data-act="admin-close">Annuler</button>';
    html += "</form>";
  } else {
    html += '<button type="button" class="orga" data-act="admin-open">Espace organisateurs</button>';
  }
  html += "</footer></main>";

  app.innerHTML = html;
  const editInput = app.querySelector("[data-edit-input]");
  if (editInput) { editInput.focus(); editInput.select(); }
  if (adminOpen && !isAdmin) {
    const codeInput = document.getElementById("admin-code");
    if (codeInput) codeInput.focus();
  }
}

document.getElementById("app").addEventListener("click", function (ev) {
  const btn = ev.target.closest("[data-act]");
  if (!btn || saving) return;
  const act = btn.getAttribute("data-act");
  const id = btn.getAttribute("data-id");
  if (act === "tab") {
    view = btn.getAttribute("data-view");
    try { sessionStorage.setItem("anniv-view", view); } catch (e) {}
    render();
  } else if (act === "admin-open") {
    adminOpen = true;
    render();
  } else if (act === "admin-close") {
    adminOpen = false;
    render();
  } else if (act === "admin-off") {
    isAdmin = false;
    adminOpen = false;
    setAdminToken(null);
    editingId = null;
    armedDeleteId = null;
    render();
  } else if (act === "pick-me") {
    setMe(id);
    render();
  } else if (act === "not-me") {
    setMe(null);
    joinName = "";
    render();
  } else if (act === "me-status") {
    const status = btn.getAttribute("data-status");
    save(function (next) {
      const g = next.guests.find(function (x) { return x.id === meId; });
      if (!g || g.status === status) return false;
      g.status = status;
    });
  } else if (act === "me-camp") {
    const camp = btn.getAttribute("data-camp");
    save(function (next) {
      const g = next.guests.find(function (x) { return x.id === meId; });
      if (!g || g.camp === camp) return false;
      g.camp = camp;
    });
  } else if (act === "join-camp") {
    joinCamp = btn.getAttribute("data-camp");
    render();
    const input = document.getElementById("join-name");
    if (input) {
      const end = input.value.length;
      input.focus();
      input.setSelectionRange(end, end);
    }
  } else if (act === "camp") {
    draftCamp = btn.getAttribute("data-camp");
    const nameInput = document.getElementById("guest-name");
    if (nameInput) draftName = nameInput.value;
    render();
    const back = document.getElementById("guest-name");
    if (back && draftName) back.focus();
  } else if (act === "status") {
    if (!isAdmin) return;
    const status = btn.getAttribute("data-status");
    save(function (next) {
      const g = next.guests.find(function (x) { return x.id === id; });
      if (!g || g.status === status) return false;
      g.status = status;
    });
  } else if (act === "edit") {
    if (!isAdmin) return;
    editingId = id;
    armedDeleteId = null;
    render();
  } else if (act === "cancel-edit") {
    editingId = null;
    render();
  } else if (act === "del") {
    if (!isAdmin) return;
    if (armedDeleteId === id) {
      clearTimeout(armedTimer);
      save(function (next) {
        const i = next.guests.findIndex(function (x) { return x.id === id; });
        if (i < 0) return false;
        next.guests.splice(i, 1);
      });
      if (meId === id) setMe(null);
    } else {
      armedDeleteId = id;
      render();
      clearTimeout(armedTimer);
      armedTimer = setTimeout(function () {
        if (armedDeleteId === id) { armedDeleteId = null; render(); }
      }, 4000);
    }
  }
});

document.getElementById("app").addEventListener("input", function (ev) {
  const t = ev.target;
  if (!t) return;
  if (t.id === "guest-name") {
    draftName = t.value;
  } else if (t.id === "join-name") {
    joinName = t.value;
    const pos = t.selectionStart;
    render();
    const input = document.getElementById("join-name");
    if (input) {
      input.focus();
      input.setSelectionRange(pos, pos);
    }
  }
});

document.getElementById("app").addEventListener("submit", function (ev) {
  const form = ev.target.closest("[data-form]");
  if (!form) return;
  ev.preventDefault();
  if (saving) return;
  const kind = form.getAttribute("data-form");
  if (kind === "unlock") {
    const input = document.getElementById("admin-code");
    const code = (input && input.value) || "";
    if (!code) return;
    sha256(code).then(function (h) {
      if (!h) { toast("Impossible de vérifier le code sur cet appareil."); return; }
      if (h === state.adminHash) {
        isAdmin = true;
        adminOpen = false;
        setAdminToken(h);
        view = "liste";
        try { sessionStorage.setItem("anniv-view", view); } catch (e) {}
        render();
        toast("Mode organisateurs activé.");
      } else {
        toast("Code incorrect.");
      }
    });
  } else if (kind === "code") {
    if (!isAdmin) return;
    const input = document.getElementById("admin-newcode");
    const code = ((input && input.value) || "").trim();
    if (code.length < 4) { toast("Le code doit faire au moins 4 caractères."); return; }
    sha256(code).then(function (h) {
      if (!h) { toast("Impossible de calculer le code sur cet appareil."); return; }
      setAdminToken(h);
      save(function (next) {
        next.adminHash = h;
      });
    });
  } else if (kind === "join") {
    const name = joinName.trim();
    if (!name) { toast("Écris ton prénom !"); return; }
    if (norm(name).length < 2) { toast("Ton prénom fait au moins 2 lettres, non ? \u{1F609}"); return; }
    const existing = state.guests.find(function (g) { return norm(g.name) === norm(name); });
    if (existing) {
      setMe(existing.id);
      joinName = "";
      render();
      return;
    }
    const newId = uid();
    setMe(newId);
    const camp = joinCamp;
    save(function (next) {
      next.guests.push({ id: newId, name: name, camp: camp, status: "oui" });
    });
  } else if (kind === "add") {
    if (!isAdmin) return;
    const name = (document.getElementById("guest-name").value || "").trim();
    if (!name) { toast("Il manque le prénom !"); return; }
    const camp = draftCamp;
    draftName = "";
    save(function (next) {
      next.guests.push({ id: uid(), name: name, camp: camp, status: "oui" });
    });
  } else if (kind === "rename") {
    if (!isAdmin) return;
    const id = form.getAttribute("data-id");
    const input = form.querySelector("[data-edit-input]");
    const name = (input.value || "").trim();
    if (!name) { toast("Le nom ne peut pas être vide."); return; }
    save(function (next) {
      const g = next.guests.find(function (x) { return x.id === id; });
      if (!g || g.name === name) { editingId = null; return false; }
      g.name = name;
    });
    if (editingId === null) render();
  }
});

meId = getMe();
if (meId && !state.guests.some(function (g) { return g.id === meId; })) {
  setMe(null);
}
isAdmin = getAdminToken() === state.adminHash;
try {
  const storedView = sessionStorage.getItem("anniv-view");
  if (storedView === "moi" || storedView === "liste") view = storedView;
  const draft = JSON.parse(sessionStorage.getItem("anniv-draft") || "null");
  if (draft) {
    if (typeof draft.name === "string") draftName = draft.name;
    if (CAMPS[draft.camp]) draftCamp = draft.camp;
    sessionStorage.removeItem("anniv-draft");
  }
} catch (e) {}

render();
</script>
