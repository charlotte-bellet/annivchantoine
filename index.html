<title>Anniv Charlotte &amp; Antoine</title>
<div id="app"></div>
<script type="application/json" id="state">{"guests":[],"updated":null}</script>
<script>
"use strict";
const SRC = document.currentScript.textContent;

const TITLE_TEXT = "Anniv Charlotte & Antoine";
const FONTS_HREF = "https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap";

const CSS = `
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF2EA; --card:#FFFFFF; --ink:#3A2430; --muted:#97707F;
  --line:#EEDCD2; --accent:#CE4877; --accent-ink:#FFFFFF;
  --charlotte:#CE4877; --antoine:#3B7FA8; --deux:#8A63B8;
  --ok:#2F8F5B; --maybe:#B57A15; --off:#9C8F96;
  --chip:#F6E7DC; --danger:#B4373C;
  --shadow:0 1px 2px rgba(58,36,48,.06),0 10px 28px rgba(58,36,48,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241922; --card:#31222E; --ink:#F6EAEF; --muted:#C29DAD;
    --line:#4A3543; --accent:#E76F9B; --accent-ink:#2A1017;
    --charlotte:#E76F9B; --antoine:#6FB2D8; --deux:#B18BE0;
    --ok:#5CBE87; --maybe:#E0B15C; --off:#8D8089;
    --chip:#3D2C3A; --danger:#E4737A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#241922; --card:#31222E; --ink:#F6EAEF; --muted:#C29DAD;
  --line:#4A3543; --accent:#E76F9B; --accent-ink:#2A1017;
  --charlotte:#E76F9B; --antoine:#6FB2D8; --deux:#B18BE0;
  --ok:#5CBE87; --maybe:#E0B15C; --off:#8D8089;
  --chip:#3D2C3A; --danger:#E4737A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:6px;z-index:20;
  background:repeating-linear-gradient(90deg,var(--charlotte) 0 44px,var(--deux) 44px 88px,var(--antoine) 88px 132px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

.wrap{max-width:560px;margin:0 auto;padding:34px 18px 60px}
.hero{text-align:center;margin-bottom:26px}
.eyebrow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.jchip{background:var(--chip);color:var(--ink);border-radius:999px;padding:2px 10px;letter-spacing:.04em}
.hero h1{font-family:"Baloo 2","Figtree",system-ui,sans-serif;font-weight:800;
  font-size:clamp(2rem,8vw,2.7rem);line-height:1.08;margin-top:8px;text-wrap:balance}
.hero .amp{color:var(--accent);font-style:italic}
.hero .sub{margin-top:10px;color:var(--muted);font-size:.95rem;max-width:40ch;margin-left:auto;margin-right:auto}

.banner{background:var(--chip);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:.9rem;margin-bottom:16px;text-align:center}

.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.stat{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow)}
.stat b{font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot-ok{background:var(--ok)} .dot-maybe{background:var(--maybe)}
.dot-charlotte{background:var(--charlotte)} .dot-antoine{background:var(--antoine)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.add{padding:16px;margin-bottom:22px}
.add label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.add input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;background:var(--bg)}
.add input[type=text]::placeholder{color:var(--muted);opacity:.8}
.campseg{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.campseg button{flex:1;min-width:100px;border:1.5px solid var(--line);border-radius:10px;
  padding:8px 6px;font-size:.88rem;font-weight:600;background:var(--bg);transition:background .15s,border-color .15s}
.campseg button[aria-pressed=true]{border-color:currentColor}
.campseg .c-charlotte[aria-pressed=true]{color:var(--charlotte);background:var(--chip)}
.campseg .c-antoine[aria-pressed=true]{color:var(--antoine);background:var(--chip)}
.campseg .c-deux[aria-pressed=true]{color:var(--deux);background:var(--chip)}
.add .go{width:100%;margin-top:12px;background:var(--accent);color:var(--accent-ink);
  border-radius:12px;padding:11px;font-family:"Baloo 2","Figtree",sans-serif;
  font-weight:700;font-size:1.05rem;transition:filter .15s}
.add .go:hover{filter:brightness(1.07)}
.add .go:disabled,.guest button:disabled{opacity:.5;cursor:not-allowed}

.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.listhead h2{font-family:"Baloo 2","Figtree",sans-serif;font-weight:700;font-size:1.15rem}
.listhead span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.guests{list-style:none;display:flex;flex-direction:column;gap:8px}
.guest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px}
.gwho{flex:1;min-width:130px}
.gname{font-weight:700;overflow-wrap:anywhere}
.gcamp{font-size:.78rem;font-weight:600}
.gcamp.c-charlotte{color:var(--charlotte)} .gcamp.c-antoine{color:var(--antoine)} .gcamp.c-deux{color:var(--deux)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:5px 10px;font-size:.8rem;font-weight:600;color:var(--muted);background:transparent}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{color:#fff}
.seg .s-oui[aria-pressed=true]{background:var(--ok)}
.seg .s-peutetre[aria-pressed=true]{background:var(--maybe)}
.seg .s-non[aria-pressed=true]{background:var(--off)}
.gtools{display:flex;gap:2px}
.gtools button{color:var(--muted);border-radius:8px;padding:4px 7px;font-size:.95rem;line-height:1}
.gtools button:hover{color:var(--ink);background:var(--chip)}
.gtools .armed{color:var(--danger);font-size:.78rem;font-weight:700}
.editrow{display:flex;gap:6px;flex:1;min-width:200px}
.editrow input{flex:1;border:1.5px solid var(--accent);border-radius:8px;padding:6px 10px;background:var(--bg);min-width:0}
.editrow button{border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:700}
.editrow .ok{background:var(--accent);color:var(--accent-ink)}
.editrow .no{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:.95rem}
.empty b{display:block;font-family:"Baloo 2","Figtree",sans-serif;font-size:1.15rem;color:var(--ink);margin-bottom:4px}

.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:.82rem;display:flex;flex-direction:column;gap:4px}

.overlay{position:fixed;inset:0;background:rgba(30,15,25,.45);display:flex;
  align-items:center;justify-content:center;z-index:50}
.overlay div{background:var(--card);color:var(--ink);border-radius:14px;padding:16px 24px;
  font-weight:700;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 18px;
  font-size:.9rem;font-weight:600;box-shadow:var(--shadow);max-width:92vw;text-align:center}
`;

const PARTY = { y: 2026, m: 9, d: 17, label: "Samedi 17 octobre" };

const CAMPS = {
  charlotte: { short: "Copine/copain de Charlotte", cls: "c-charlotte" },
  antoine:   { short: "Copine/copain d'Antoine",    cls: "c-antoine" },
  deux:      { short: "Les deux",                   cls: "c-deux" }
};
const STATUSES = { oui: "Oui", peutetre: "Peut-être", non: "Non" };

let state = readState();
let artifact = null;
let artifactKnown = false;
let readOnly = false;
let saving = false;
let editingId = null;
let armedDeleteId = null;
let armedTimer = null;
let draftName = "";
let draftCamp = "charlotte";

function readState() {
  try {
    const raw = JSON.parse(document.getElementById("state").textContent);
    if (raw && Array.isArray(raw.guests)) {
      raw.guests = raw.guests.filter(function (g) { return g && typeof g.name === "string"; });
      return raw;
    }
  } catch (e) {}
  return { guests: [], updated: null };
}

(function injectHead() {
  document.title = TITLE_TEXT;
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = FONTS_HREF;
  document.head.appendChild(link);
  const style = document.createElement("style");
  style.textContent = CSS;
  document.head.appendChild(style);
})();

const artifactReady = (window.claude && window.claude.use)
  ? window.claude.use("artifact")
  : Promise.resolve(null);
artifactReady.then(function (ns) {
  artifact = ns;
  artifactKnown = true;
  render();
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function buildDocument(next) {
  const json = JSON.stringify(next).replace(/</g, "\\u003c");
  return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<title>Anniv Charlotte &amp; Antoine</title>\n</head>\n<body>\n' +
    '<div id="app"></div>\n' +
    '<script type="application/json" id="state">' + json + '<\/script>\n' +
    '<script>' + SRC + '<\/script>\n' +
    '</body>\n</html>';
}

function daysLeft() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(PARTY.y, PARTY.m, PARTY.d) - today) / 86400000);
}

function fmtUpdated(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) +
      " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return ""; }
}

function overlay(msg) {
  hideOverlay();
  const el = document.createElement("div");
  el.className = "overlay";
  el.id = "overlay";
  const inner = document.createElement("div");
  inner.textContent = msg;
  el.appendChild(inner);
  document.body.appendChild(el);
}
function hideOverlay() {
  const el = document.getElementById("overlay");
  if (el) el.remove();
}
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 4500);
}

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function save(mutate) {
  if (saving) return;
  const next = JSON.parse(JSON.stringify(state));
  if (mutate(next) === false) return;
  next.updated = new Date().toISOString();
  const art = artifact || (await artifactReady);
  if (!art) {
    toast("Impossible d'enregistrer ici — ouvre la page via le lien partagé sur claude.ai.");
    return;
  }
  saving = true;
  state = next;
  editingId = null;
  armedDeleteId = null;
  render();
  overlay("Enregistrement…");
  try {
    sessionStorage.setItem("anniv-draft", JSON.stringify({ name: draftName, camp: draftCamp }));
  } catch (e) {}
  try {
    await art.publish(buildDocument(next));
    overlay("Enregistré — mise à jour…");
  } catch (err) {
    const code = err && err.code;
    if (code === "conflict") {
      overlay("Quelqu'un vient de modifier la liste — rechargement…");
      return;
    }
    if (code === "upstream_error") {
      try {
        await new Promise(function (r) { setTimeout(r, 600 + Math.random() * 900); });
        await art.publish(buildDocument(next));
        overlay("Enregistré — mise à jour…");
        return;
      } catch (err2) { err = err2; }
    }
    saving = false;
    hideOverlay();
    state = readState();
    const c2 = err && err.code;
    if (c2 === "conflict") { overlay("Quelqu'un vient de modifier la liste — rechargement…"); return; }
    if (c2 === "not_writer" || c2 === "not_granted" || c2 === "not_declared" ||
        c2 === "consent_required" || c2 === "capability_disabled" || c2 === "capability_removed") {
      readOnly = true;
      render();
      toast("Ce lien est en lecture seule : la liste est visible mais pas modifiable.");
    } else if (c2 === "rate_limited") {
      render();
      toast("Trop de modifications d'un coup — attends quelques secondes et réessaie.");
    } else {
      render();
      toast("L'enregistrement a échoué — réessaie.");
    }
  }
}

function counts() {
  const g = state.guests;
  function n(f) { return g.filter(f).length; }
  return {
    oui: n(function (x) { return x.status === "oui"; }),
    peutetre: n(function (x) { return x.status === "peutetre"; }),
    charlotte: n(function (x) { return x.status !== "non" && (x.camp === "charlotte" || x.camp === "deux"); }),
    antoine: n(function (x) { return x.status !== "non" && (x.camp === "antoine" || x.camp === "deux"); })
  };
}

function render() {
  const app = document.getElementById("app");
  const c = counts();
  const dl = daysLeft();
  const jchip = dl > 0 ? "J‑" + dl
    : dl === 0 ? "C'est aujourd'hui !"
    : "";
  const canEdit = !readOnly && (!artifactKnown || artifact);

  let html = '<main class="wrap">';
  html += '<header class="hero">';
  html += '<p class="eyebrow"><span>' + PARTY.label + "</span>" +
    (jchip ? '<span class="jchip">' + jchip + "</span>" : "") + "</p>";
  html += '<h1>Anniv Charlotte <span class="amp">&amp;</span> Antoine</h1>';
  html += '<p class="sub">La liste des invité·es, à remplir par tout le monde. Chaque modification est enregistrée et visible par tous.</p>';
  html += "</header>";

  if (readOnly) {
    html += '<p class="banner">Lecture seule — ce lien ne permet pas de modifier la liste.</p>';
  } else if (artifactKnown && !artifact) {
    html += '<p class="banner">Aperçu local — ouvre la page via le lien partagé pour que tes modifications s’enregistrent.</p>';
  }

  html += '<section class="stats" aria-label="Compteurs">';
  html += '<span class="stat"><span class="dot dot-ok"></span><b>' + c.oui + "</b>&nbsp;présent·es</span>";
  html += '<span class="stat"><span class="dot dot-maybe"></span><b>' + c.peutetre + "</b>&nbsp;peut-être</span>";
  html += '<span class="stat"><span class="dot dot-charlotte"></span><b>' + c.charlotte + "</b>&nbsp;côté Charlotte</span>";
  html += '<span class="stat"><span class="dot dot-antoine"></span><b>' + c.antoine + "</b>&nbsp;côté Antoine</span>";
  html += "</section>";

  if (canEdit) {
    html += '<form class="add card" data-form="add">';
    html += '<label for="guest-name">Ajouter quelqu’un</label>';
    html += '<input type="text" id="guest-name" maxlength="60" placeholder="Prénom (et nom si besoin)" autocomplete="off" value="' + esc(draftName) + '">';
    html += '<div class="campseg" role="group" aria-label="Copain de qui ?">';
    ["charlotte", "antoine", "deux"].forEach(function (k) {
      const lbl = k === "charlotte" ? "Charlotte" : k === "antoine" ? "Antoine" : "Les deux";
      html += '<button type="button" class="' + CAMPS[k].cls + '" data-act="camp" data-camp="' + k +
        '" aria-pressed="' + (draftCamp === k) + '">' + lbl + "</button>";
    });
    html += "</div>";
    html += '<button type="submit" class="go">Ajouter à la liste</button>';
    html += "</form>";
  }

  html += '<div class="listhead"><h2>Les invité·es</h2><span>' +
    state.guests.length + (state.guests.length > 1 ? " personnes" : " personne") + "</span></div>";

  if (!state.guests.length) {
    html += '<div class="card empty"><b>Personne pour l’instant</b>Ajoute les premiers copains, la liste se remplit toute seule.</div>';
  } else {
    html += '<ul class="guests">';
    state.guests.forEach(function (g) {
      const camp = CAMPS[g.camp] || CAMPS.deux;
      html += '<li class="guest card" data-id="' + esc(g.id) + '">';
      if (editingId === g.id && canEdit) {
        html += '<form class="editrow" data-form="rename" data-id="' + esc(g.id) + '">';
        html += '<input type="text" maxlength="60" value="' + esc(g.name) + '" aria-label="Nouveau nom" data-edit-input>';
        html += '<button type="submit" class="ok">OK</button>';
        html += '<button type="button" class="no" data-act="cancel-edit">Annuler</button>';
        html += "</form>";
      } else {
        html += '<div class="gwho"><div class="gname">' + esc(g.name) + '</div>' +
          '<div class="gcamp ' + camp.cls + '">' + camp.short + "</div></div>";
        html += '<div class="seg" role="group" aria-label="Statut de ' + esc(g.name) + '">';
        Object.keys(STATUSES).forEach(function (s) {
          html += '<button type="button" class="s-' + s + '" data-act="status" data-id="' + esc(g.id) +
            '" data-status="' + s + '" aria-pressed="' + (g.status === s) + '"' +
            (canEdit ? "" : " disabled") + ">" + STATUSES[s] + "</button>";
        });
        html += "</div>";
        if (canEdit) {
          html += '<div class="gtools">';
          html += '<button type="button" data-act="edit" data-id="' + esc(g.id) + '" aria-label="Renommer ' + esc(g.name) + '">✎</button>';
          if (armedDeleteId === g.id) {
            html += '<button type="button" class="armed" data-act="del" data-id="' + esc(g.id) + '">Supprimer ?</button>';
          } else {
            html += '<button type="button" data-act="del" data-id="' + esc(g.id) + '" aria-label="Supprimer ' + esc(g.name) + '">×</button>';
          }
          html += "</div>";
        }
      }
      html += "</li>";
    });
    html += "</ul>";
  }

  html += '<footer class="foot">';
  if (state.updated) html += "<span>Dernière modification le " + esc(fmtUpdated(state.updated)) + "</span>";
  html += "<span>Rendez-vous le 17 octobre — la liste est partagée, sois sympa avec elle \u{1F389}</span>";
  html += "</footer></main>";

  app.innerHTML = html;
  const editInput = app.querySelector("[data-edit-input]");
  if (editInput) { editInput.focus(); editInput.select(); }
}

document.getElementById("app").addEventListener("click", function (ev) {
  const btn = ev.target.closest("[data-act]");
  if (!btn || saving) return;
  const act = btn.getAttribute("data-act");
  const id = btn.getAttribute("data-id");
  if (act === "camp") {
    draftCamp = btn.getAttribute("data-camp");
    const nameInput = document.getElementById("guest-name");
    if (nameInput) draftName = nameInput.value;
    render();
    const back = document.getElementById("guest-name");
    if (back && draftName) back.focus();
  } else if (act === "status") {
    const status = btn.getAttribute("data-status");
    save(function (next) {
      const g = next.guests.find(function (x) { return x.id === id; });
      if (!g || g.status === status) return false;
      g.status = status;
    });
  } else if (act === "edit") {
    editingId = id;
    armedDeleteId = null;
    render();
  } else if (act === "cancel-edit") {
    editingId = null;
    render();
  } else if (act === "del") {
    if (armedDeleteId === id) {
      clearTimeout(armedTimer);
      save(function (next) {
        const i = next.guests.findIndex(function (x) { return x.id === id; });
        if (i < 0) return false;
        next.guests.splice(i, 1);
      });
    } else {
      armedDeleteId = id;
      render();
      clearTimeout(armedTimer);
      armedTimer = setTimeout(function () {
        if (armedDeleteId === id) { armedDeleteId = null; render(); }
      }, 4000);
    }
  }
});

document.getElementById("app").addEventListener("input", function (ev) {
  if (ev.target && ev.target.id === "guest-name") draftName = ev.target.value;
});

document.getElementById("app").addEventListener("submit", function (ev) {
  const form = ev.target.closest("[data-form]");
  if (!form) return;
  ev.preventDefault();
  if (saving) return;
  const kind = form.getAttribute("data-form");
  if (kind === "add") {
    const name = (document.getElementById("guest-name").value || "").trim();
    if (!name) { toast("Il manque le prénom !"); return; }
    const camp = draftCamp;
    draftName = "";
    save(function (next) {
      next.guests.push({ id: uid(), name: name, camp: camp, status: "oui" });
    });
  } else if (kind === "rename") {
    const id = form.getAttribute("data-id");
    const input = form.querySelector("[data-edit-input]");
    const name = (input.value || "").trim();
    if (!name) { toast("Le nom ne peut pas être vide."); return; }
    save(function (next) {
      const g = next.guests.find(function (x) { return x.id === id; });
      if (!g || g.name === name) { editingId = null; return false; }
      g.name = name;
    });
    if (editingId === null) render();
  }
});

try {
  const draft = JSON.parse(sessionStorage.getItem("anniv-draft") || "null");
  if (draft) {
    if (typeof draft.name === "string") draftName = draft.name;
    if (CAMPS[draft.camp]) draftCamp = draft.camp;
    sessionStorage.removeItem("anniv-draft");
  }
} catch (e) {}

render();
</script>
