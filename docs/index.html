<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>PACS &amp; 60 ans — Charlotte &amp; Antoine</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#25412F; --green2:#2E5941; --terra:#C96A4A; --terra2:#B65B3C;
  --cream:#FAF6EE; --sand:#E9DFCC; --gold:#B08D3E;
  --ink:#23281F; --muted:#7C766A; --oncream-line:rgba(35,40,31,.16);
  --st-oui:#3E7A52; --st-peutetre:#B78428; --st-non:#9B948A;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--green);color:var(--ink);line-height:1.45;min-height:100vh;
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

.scr{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr-home{background:var(--green);color:var(--cream)}
.scr-status,.scr-who,.scr-done,.scr-list{background:var(--cream)}
.in{width:100%;max-width:430px;margin:0 auto;padding:0 22px;position:relative}
.top{padding:14px 0 0}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0}
.bottom{padding:0 0 34px}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}60%{transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-14px)}}
.a1{animation:rise .6s ease both}
.a2{animation:rise .6s .15s ease both}
.a3{animation:rise .6s .3s ease both}
.a4{animation:rise .6s .45s ease both}
.logo{animation:pop .7s ease both;line-height:0}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;border-radius:50%}
.confetti .c1{width:7px;height:7px;background:var(--gold);opacity:.55;top:12%;left:12%;animation:floaty 8s ease-in-out infinite}
.confetti .c2{width:5px;height:5px;background:var(--terra);opacity:.6;top:9%;right:16%;animation:drift 9s .5s ease-in-out infinite}
.confetti .c3{width:9px;height:9px;background:transparent;border:1px solid var(--cream);opacity:.4;top:24%;right:9%;animation:floaty 10s 1s ease-in-out infinite}
.confetti .c4{width:5px;height:5px;background:var(--cream);opacity:.4;top:36%;left:7%;animation:drift 11s .8s ease-in-out infinite}
.confetti .c5{width:6px;height:6px;background:var(--gold);opacity:.45;bottom:30%;right:12%;animation:floaty 9s .3s ease-in-out infinite}
.confetti .c6{width:8px;height:8px;background:transparent;border:1px solid var(--terra);opacity:.5;bottom:20%;left:13%;animation:drift 8.5s 1.2s ease-in-out infinite}
.confetti .c7{width:5px;height:5px;background:var(--cream);opacity:.5;bottom:12%;left:44%;animation:floaty 10.5s .6s ease-in-out infinite}

.serif{font-family:"Cormorant Garamond",Georgia,serif}
.h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:clamp(40px,11vw,52px);line-height:1.02;letter-spacing:.01em}
.h1 .amp{font-style:italic;font-weight:500;color:var(--terra)}
.names{margin-top:10px;font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.stitle{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:clamp(30px,8vw,36px);line-height:1.08;overflow-wrap:anywhere}
.lede{margin-top:12px;font-size:16px;font-weight:300;line-height:1.5}

.facts{margin-top:28px;display:flex;flex-direction:column;gap:15px;font-size:16px;line-height:1.35;font-weight:300}
.fact{display:flex;gap:13px;align-items:center}
.tile{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:rgba(250,246,238,.1);border:1px solid rgba(250,246,238,.35)}
.tile svg{display:block}
.fact b{font-weight:500}
.note{margin-top:22px;border:1px solid rgba(250,246,238,.3);border-radius:14px;
  padding:13px 16px;font-size:13.5px;font-weight:300;line-height:1.5;opacity:.95}
.note b{font-weight:500}

.backbtn{width:44px;height:44px;border-radius:9999px;background:rgba(255,255,255,.55);
  border:1px solid var(--oncream-line);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink)}
.scr-home .backbtn{background:rgba(250,246,238,.12);border-color:rgba(250,246,238,.35);color:var(--cream)}

.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;
  border-radius:9999px;background:var(--green);color:var(--cream);font-size:16px;font-weight:500;
  letter-spacing:.04em;text-decoration:none;transition:opacity .15s,transform .1s}
.cta:hover{opacity:.92}
.cta:active{transform:scale(.985)}
.cta-terra{background:var(--terra)}
.cta-ghost{background:transparent;color:var(--ink);border:1px solid var(--oncream-line)}
button:disabled{opacity:.5;cursor:not-allowed}
.small{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.linkbtn{display:block;margin:16px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;padding:4px;text-align:center}
.scr-home .linkbtn{color:rgba(250,246,238,.85)}

.opts{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.opt{display:flex;align-items:center;gap:14px;padding:21px 18px;border-radius:16px;
  background:#fff;border:1px solid var(--sand);text-align:left;width:100%;transition:transform .1s,border-color .15s}
.opt:hover{border-color:var(--green2)}
.opt:active{transform:scale(.98)}
.opt .col{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .t{font-size:18px;font-weight:500}
.opt .s{font-size:14px;color:var(--muted);font-weight:300}
.opt .arrow{font-size:18px;color:var(--muted)}

.field{width:100%;background:#fff;border:1px solid var(--sand);border-radius:14px;
  padding:15px 16px;font-size:16px;margin-top:20px}
.field::placeholder{color:var(--muted)}
.field:focus{outline:none;border-color:var(--green2)}
.hint{margin-top:12px;font-size:14px;color:var(--muted);font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{background:#fff;border:1px solid var(--sand);border-radius:9999px;
  padding:10px 16px;font-size:15px;font-weight:500}
.chips button:hover{border-color:var(--terra);color:var(--terra2)}
.chiplabel{margin-top:18px;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}

.tpills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tpills button{padding:9px 16px;border-radius:9999px;background:#fff;
  border:1px solid var(--sand);font-size:14px;font-weight:500}
.tpills button[aria-pressed=true]{background:var(--green);color:var(--cream);border-color:var(--green)}

.plusrow{display:flex;align-items:center;gap:12px;margin-top:24px;padding:0 2px}
.plusrow .col{flex:1;display:flex;flex-direction:column;gap:2px}
.plusrow .t{font-size:17px;font-weight:500}
.plusrow .s{font-size:13.5px;color:var(--muted);font-weight:300}
.step{display:flex;align-items:center;gap:12px;flex:none}
.step button{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--sand);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;line-height:1}
.step .n{font-size:21px;font-weight:500;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}

.donecard{margin-top:26px;background:#fff;border:1px solid var(--sand);border-radius:18px;
  padding:20px;display:flex;flex-direction:column;gap:12px}
.doneline{display:flex;justify-content:space-between;gap:12px;font-size:15.5px}
.doneline .k{color:var(--muted);font-weight:300}
.doneline .v{font-weight:500;text-align:right}
.thanks{margin-top:12px;font-size:16px;font-weight:300;line-height:1.55}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.filters button{flex:none;padding:8px 15px;border-radius:9999px;background:#fff;
  border:1px solid var(--sand);font-size:14px}
.filters button[aria-pressed=true]{background:var(--green);color:var(--cream);border-color:var(--green);font-weight:500}
.rows{margin-top:12px}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--sand);flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;font-size:13px;font-weight:500;color:var(--cream);
  display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.03em}
.row .who{flex:1;min-width:120px;display:flex;flex-direction:column}
.row .nm{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.row .mt{font-size:13px;color:var(--muted);font-weight:300}
.stw{font-weight:500}
.st-oui .stw{color:var(--st-oui)}
.st-peutetre .stw{color:var(--st-peutetre)}
.st-non .stw{color:var(--st-non)}
.pluspill{font-size:12.5px;font-weight:500;color:var(--cream);padding:4px 9px;border-radius:9999px;flex:none}
.empty{padding:26px 0;color:var(--muted);font-size:15px;font-weight:300}
.total{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--oncream-line)}
.total .col{flex:1;display:flex;flex-direction:column}
.total .t{font-size:15px;font-weight:500}
.total .s{font-size:13px;color:var(--muted);font-weight:300}

.seg{display:flex;border:1px solid var(--sand);border-radius:9999px;overflow:hidden;background:#fff}
.seg button{padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button + button{border-left:1px solid var(--sand)}
.seg button[aria-pressed=true]{background:var(--green);color:var(--cream)}
.gtools{display:flex;gap:2px;align-items:center}
.gtools button{color:var(--muted);border-radius:10px;padding:5px 8px;font-size:15px;line-height:1}
.gtools .cycle{border:1px solid var(--sand);background:#fff;border-radius:9999px;font-size:13px;font-weight:500;padding:5px 10px}
.gtools .armed{color:#A94438;font-size:13px;font-weight:600}
.editrow{display:flex;gap:6px;flex:1;min-width:200px}
.editrow input{flex:1;min-width:0;background:#fff;border:1px solid var(--sand);border-radius:12px;padding:9px 12px;font-size:15px}
.editrow button{border-radius:9999px;padding:8px 14px;font-size:14px;font-weight:500}
.editrow .ok{background:var(--green);color:var(--cream)}
.editrow .no{color:var(--muted)}
.addform{padding:14px 0 18px;border-bottom:1px dashed var(--sand)}
.addform .cta{height:48px;margin-top:12px;font-size:15px}
.addform .field{margin-top:0}

.foot{margin-top:32px;text-align:center;color:var(--muted);font-size:13px;font-weight:300;
  display:flex;flex-direction:column;gap:10px;align-items:center}
.adminbox{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:#fff;
  border:1px solid var(--sand);border-radius:18px;padding:12px;max-width:100%}
.adminbox input{width:190px;background:var(--cream);border:1px solid var(--sand);border-radius:12px;padding:9px 12px;font-size:14px}
.adminbox button{background:var(--green);color:var(--cream);border-radius:9999px;padding:9px 16px;font-size:14px;font-weight:500}
.adminbox .quiet{background:none;color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(35,40,31,.45);display:flex;
  align-items:center;justify-content:center;z-index:50}
.overlay div{background:var(--cream);color:var(--ink);border-radius:16px;padding:16px 26px;font-weight:500}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--cream);border-radius:9999px;padding:12px 22px;
  font-size:15px;font-weight:500;max-width:92vw;text-align:center}
.loading{text-align:center;padding:80px 20px;font-weight:500;color:var(--cream)}
</style>
</head>
<body>
<div id="app"><p class="loading">Un instant…</p></div>
<script>
"use strict";

var INITIAL_STATE = null;
try { INITIAL_STATE = JSON.parse(localStorage.getItem("anniv-cache") || "null"); } catch (e) {}

var PARTY = { y: 2026, m: 9, d: 17 };
var CAL_URL = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
  "&text=" + encodeURIComponent("PACS & 60 ans Charlotte Antoine B") +
  "&dates=20261017T183000/20261018T020000" +
  "&ctz=Europe/Paris" +
  "&location=" + encodeURIComponent("Sterne, 36 rue de la Condamine") +
  "&details=" + encodeURIComponent("Cocktail et dîner — merci de venir partager ce moment tous ensemble !");
var TEAMS = {
  charlotte: { label: "Team Charlotte", av: "#C96A4A" },
  antoine:   { label: "Team Antoine",   av: "#2E5941" },
  deux:      { label: "Team les deux",  av: "#B08D3E" }
};
var OPTS = {
  oui: { t: "Carrément",  s: "Réserve-moi une place" },
  non: { t: "Je peux pas", s: "Et je le regrette déjà…" }
};
var STATUS_WORD = { oui: "Vient", peutetre: "Peut-être", non: "Vient pas" };
var STATUS_EMOJI = { oui: "\u{1F942}", peutetre: "\u{1F914}", non: "\u{1F622}" };
var SEG = { oui: "Oui", non: "Non" };
var MAX_PLUS = 2;
var SCREEN_BG = { home: "#25412F", status: "#FAF6EE", who: "#FAF6EE", done: "#FAF6EE", list: "#FAF6EE" };

var state = { guests: [], updated: "" };
var loaded = false;
var busy = false;
var pending = 0;
var screen = "home";
var pendingStatus = "oui";
var plusDraft = 0;
var isAdmin = false;
var adminOpen = false;
var adminCode = null;
var filter = "tous";
var editingId = null;
var armedDeleteId = null;
var armedTimer = null;
var draftName = "";
var draftCamp = "charlotte";
var joinName = "";
var joinCamp = "charlotte";
var meId = null;

// —— Configuration Supabase ——
var SUPABASE_URL = "https://mfkeflxuvshfgarzwfxf.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_Dc8LEFPjghFF_Gs3M7pvKg_L0pv1rIx";

function rpc(name, body) {
  var headers = { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  if (SUPABASE_ANON_KEY.indexOf("eyJ") === 0) {
    headers["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;
  }
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: headers,
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (data) {
      if (!r.ok) {
        throw new Error((data && (data.message || data.hint || data.error_description)) || "Erreur serveur — réessaie.");
      }
      return data;
    });
  });
}

var API = {
  apiGetState: function () { return rpc("get_state", {}); },
  apiRsvp: function (name, camp, plus, clientId, status) {
    return rpc("rsvp", { p_name: name, p_camp: camp, p_plus: plus, p_client_id: clientId, p_status: status });
  },
  apiVerifyAdmin: function (code) { return rpc("verify_admin", { p_code: code }); },
  apiAdmin: function (code, op, payload) {
    return rpc("admin_op", { p_code: code, p_op: op, p_payload: payload || {} });
  }
};
function run(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return API[fn].apply(null, args);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function norm(s) {
  return String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function initials(name) {
  var parts = String(name).trim().split(/\s+/).slice(0, 2);
  return parts.map(function (p) { return p.charAt(0).toUpperCase(); }).join("") || "?";
}
function store(key, val) {
  try {
    if (val === null) localStorage.removeItem(key);
    else localStorage.setItem(key, val);
  } catch (e) {}
}
function read(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function setMe(id) { meId = id; store("anniv-me", id); }
function me_() {
  return meId ? state.guests.find(function (g) { return g.id === meId; }) : null;
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function daysLeft() {
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(PARTY.y, PARTY.m, PARTY.d) - today) / 86400000);
}

function overlay(msg) {
  hideOverlay();
  var el = document.createElement("div");
  el.className = "overlay";
  el.id = "overlay";
  var inner = document.createElement("div");
  inner.textContent = msg;
  el.appendChild(inner);
  document.body.appendChild(el);
}
function hideOverlay() {
  var el = document.getElementById("overlay");
  if (el) el.remove();
}
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 4500);
}

function applyState(s) {
  if (s && Array.isArray(s.guests)) state = s;
  try { localStorage.setItem("anniv-cache", JSON.stringify(state)); } catch (e) {}
  loaded = true;
  if (meId && !state.guests.some(function (g) { return g.id === meId; })) setMe(null);
  render();
}

function errMsg(err) {
  return (err && err.message ? err.message : "Ça n'a pas marché — réessaie.").replace(/^(Error|Exception):\s*/, "");
}

function act(promiseFactory, waitMsg) {
  if (busy) return;
  busy = true;
  render();
  overlay(waitMsg || "On note ça…");
  promiseFactory().then(function (result) {
    busy = false;
    hideOverlay();
    if (result && result.state) {
      if (result.meId) setMe(result.meId);
      applyState(result.state);
    } else {
      applyState(result);
    }
  }).catch(function (err) {
    busy = false;
    hideOverlay();
    render();
    toast(errMsg(err));
  });
}

// Action optimiste : l'écran change tout de suite, le serveur suit derrière.
function optimistic(mutate, promiseFactory) {
  var snapshot = JSON.parse(JSON.stringify(state));
  mutate(state);
  render();
  pending++;
  promiseFactory().then(function (result) {
    pending--;
    var s = result && result.state ? result.state : result;
    if (pending === 0 && !busy) applyState(s);
  }).catch(function (err) {
    pending--;
    state = snapshot;
    render();
    toast(errMsg(err));
  });
}

function counts() {
  var g = state.guests;
  var oui = g.filter(function (x) { return x.status === "oui"; });
  var plus = oui.reduce(function (t, x) { return t + (x.plus || 0); }, 0);
  return {
    oui: oui.length,
    non: g.filter(function (x) { return x.status === "non"; }).length,
    plus: plus,
    total: oui.length + plus
  };
}

function logoHtml(size) {
  var h = Math.round(size * 1.15);
  return '<span class="logo" aria-label="C et A"><svg width="' + size + '" height="' + h + '" viewBox="0 0 130 150" fill="none">' +
    '<circle cx="16" cy="36" r="3" fill="#C96A4A"/>' +
    '<rect x="100" y="18" width="6" height="6" transform="rotate(24 103 21)" fill="#B08D3E"/>' +
    '<circle cx="118" cy="52" r="2.5" fill="currentColor" opacity="0.55"/>' +
    '<path d="M 8 78 q 5 -7 10 0 t 10 0" stroke="#B08D3E" stroke-width="2" stroke-linecap="round"/>' +
    '<path d="M 110 96 l 9 4 -7 6 z" fill="#C96A4A"/>' +
    '<circle cx="24" cy="118" r="2.5" fill="#B08D3E"/>' +
    '<path d="M 108 128 v 8 M 104 132 h 8" stroke="currentColor" stroke-width="1.6" opacity="0.7"/>' +
    '<text x="50" y="46" font-family="Cormorant Garamond, Georgia, serif" font-size="46" font-weight="600" text-anchor="middle" fill="currentColor" transform="rotate(-8 50 46)">C</text>' +
    '<text x="62" y="80" font-family="Cormorant Garamond, Georgia, serif" font-size="25" font-style="italic" font-weight="500" text-anchor="middle" fill="#C96A4A">&amp;</text>' +
    '<text x="70" y="122" font-family="Cormorant Garamond, Georgia, serif" font-size="46" font-weight="600" text-anchor="middle" fill="currentColor" transform="rotate(7 70 122)">A</text>' +
    '<text x="62" y="142" font-family="Jost, sans-serif" font-size="8" letter-spacing="3.2" text-anchor="middle" fill="currentColor" opacity="0.8">17.10.2026</text>' +

function render() {
  if (!loaded) return;
  var app = document.getElementById("app");
  document.body.style.background = SCREEN_BG[screen] || SCREEN_BG.home;
  if (screen === "home") app.innerHTML = renderHome();
  else if (screen === "status") app.innerHTML = renderStatus();
  else if (screen === "who") app.innerHTML = renderWho();
  else if (screen === "done") app.innerHTML = renderDone();
  else app.innerHTML = renderList();

  var editInput = app.querySelector("[data-edit-input]");
  if (editInput) { editInput.focus(); editInput.select(); }
  if (adminOpen && !isAdmin) {
    var codeInput = document.getElementById("admin-code");
    if (codeInput) codeInput.focus();
  }
  window.scrollTo(0, 0);
}

function goTo(s) {
  screen = s;
  render();
}

/* ----------------------------- Interactions ------------------------------ */

document.getElementById("app").addEventListener("click", function (ev) {
  var btn = ev.target.closest("[data-act]");
  if (!btn || busy) return;
  var actName = btn.getAttribute("data-act");
  var id = btn.getAttribute("data-id");
  if (actName === "goto") {
    goTo(btn.getAttribute("data-screen"));
  } else if (actName === "restart") {
    goTo("status");
  } else if (actName === "pick-status") {
    pendingStatus = btn.getAttribute("data-status");
    var me = me_();
    joinName = me ? me.name : joinName;
    joinCamp = me ? me.camp : joinCamp;
    plusDraft = me ? (me.plus || 0) : plusDraft;
    goTo("who");
  } else if (actName === "pick-name") {
    var picked = state.guests.find(function (g) { return g.id === id; });
    if (picked) {
      joinName = picked.name;
      joinCamp = picked.camp;
      plusDraft = picked.plus || 0;
      render();
    }
  } else if (actName === "who-camp") {
    joinCamp = btn.getAttribute("data-camp");
    render();
  } else if (actName === "who-plus-inc" || actName === "who-plus-dec") {
    var next = plusDraft + (actName === "who-plus-inc" ? 1 : -1);
    if (next < 0 || next > MAX_PLUS) return;
    plusDraft = next;
    render();
  } else if (actName === "filter") {
    filter = btn.getAttribute("data-filter");
    render();
  } else if (actName === "admin-open") {
    adminOpen = true;
    render();
  } else if (actName === "admin-close") {
    adminOpen = false;
    render();
  } else if (actName === "admin-off") {
    isAdmin = false;
    adminOpen = false;
    adminCode = null;
    store("anniv-admin-code", null);
    editingId = null;
    armedDeleteId = null;
    render();
  } else if (actName === "status") {
    if (!isAdmin) return;
    var s2 = btn.getAttribute("data-status");
    optimistic(function (s) {
      var g = s.guests.find(function (x) { return x.id === id; });
      if (g) g.status = s2;
    }, function () { return run("apiAdmin", adminCode, "status", { id: id, status: s2 }); });
  } else if (actName === "plus-cycle") {
    if (!isAdmin) return;
    var cur = parseInt(btn.getAttribute("data-plus"), 10) || 0;
    var nxt = (cur + 1) % (MAX_PLUS + 1);
    optimistic(function (s) {
      var g = s.guests.find(function (x) { return x.id === id; });
      if (g) g.plus = nxt;
    }, function () { return run("apiAdmin", adminCode, "plus", { id: id, plus: nxt }); });
  } else if (actName === "edit") {
    if (!isAdmin) return;
    editingId = id;
    armedDeleteId = null;
    render();
  } else if (actName === "cancel-edit") {
    editingId = null;
    render();
  } else if (actName === "del") {
    if (!isAdmin) return;
    if (armedDeleteId === id) {
      clearTimeout(armedTimer);
      armedDeleteId = null;
      editingId = null;
      optimistic(function (s) {
        s.guests = s.guests.filter(function (x) { return x.id !== id; });
      }, function () { return run("apiAdmin", adminCode, "del", { id: id }); });
    } else {
      armedDeleteId = id;
      render();
      clearTimeout(armedTimer);
      armedTimer = setTimeout(function () {
        if (armedDeleteId === id) { armedDeleteId = null; render(); }
      }, 4000);
    }
  }
});

document.getElementById("app").addEventListener("input", function (ev) {
  var t = ev.target;
  if (!t) return;
  if (t.id === "guest-name") {
    draftName = t.value;
  } else if (t.id === "who-name") {
    joinName = t.value;
    var sug = document.getElementById("who-sug");
    if (sug) sug.innerHTML = whoSugHtml();
  }
});

document.getElementById("app").addEventListener("submit", function (ev) {
  var form = ev.target.closest("[data-form]");
  if (!form) return;
  ev.preventDefault();
  if (busy) return;
  var kind = form.getAttribute("data-form");
  if (kind === "who") {
    var name = joinName.trim();
    if (norm(name).length < 2) { toast("Écris ton prénom (au moins 2 lettres)."); return; }
    var st = pendingStatus;
    var camp = joinCamp;
    var plus = pendingStatus === "oui" ? plusDraft : 0;
    // Optimiste : si le nom existe on met à jour, sinon on l'ajoute — l'écran
    // de confirmation s'affiche tout de suite, le serveur fait pareil derrière.
    var snapshot = JSON.parse(JSON.stringify(state));
    var prevMe = meId;
    var prevScreen = screen;
    var match = state.guests.find(function (g) { return norm(g.name) === norm(name); });
    var targetId = match ? match.id : uid();
    if (match) {
      match.status = st;
      match.camp = camp;
      match.plus = plus;
    } else {
      state.guests.push({ id: targetId, name: name, camp: camp, status: st, plus: plus, updated: new Date().toISOString() });
    }
    setMe(targetId);
    screen = "done";
    render();
    pending++;
    run("apiRsvp", name, camp, plus, targetId, st).then(function (result) {
      pending--;
      if (result && result.meId) setMe(result.meId);
      var s = result && result.state ? result.state : result;
      if (pending === 0 && !busy) applyState(s);
    }).catch(function (err) {
      pending--;
      state = snapshot;
      setMe(prevMe);
      screen = prevScreen;
      render();
      toast(errMsg(err));
    });
  } else if (kind === "unlock") {
    var input = document.getElementById("admin-code");
    var code = (input && input.value) || "";
    if (!code) return;
    act(function () {
      return run("apiVerifyAdmin", code).then(function (ok) {
        if (!ok) throw new Error("Code organisateurs incorrect.");
        isAdmin = true;
        adminOpen = false;
        adminCode = code;
        store("anniv-admin-code", code);
        return run("apiGetState");
      });
    }, "Vérification…");
  } else if (kind === "code") {
    if (!isAdmin) return;
    var nc = document.getElementById("admin-newcode");
    var newCode = ((nc && nc.value) || "").trim();
    if (newCode.length < 4) { toast("Le code doit faire au moins 4 caractères."); return; }
    act(function () {
      return run("apiAdmin", adminCode, "code", { code: newCode }).then(function (s) {
        adminCode = newCode;
        store("anniv-admin-code", newCode);
        toast("Code organisateurs changé.");
        return s;
      });
    });
  } else if (kind === "add") {
    if (!isAdmin) return;
    var gname = (document.getElementById("guest-name").value || "").trim();
    if (!gname) { toast("Il manque le prénom."); return; }
    var acamp = draftCamp;
    draftName = "";
    act(function () { return run("apiAdmin", adminCode, "add", { name: gname, camp: acamp }); });
  } else if (kind === "rename") {
    if (!isAdmin) return;
    var rid = form.getAttribute("data-id");
    var rin = form.querySelector("[data-edit-input]");
    var rname = (rin.value || "").trim();
    if (!rname) { toast("Le nom ne peut pas être vide."); return; }
    editingId = null;
    act(function () { return run("apiAdmin", adminCode, "rename", { id: rid, name: rname }); });
  }
});

meId = read("anniv-me");
var storedCode = read("anniv-admin-code");

function bootAdmin() {
  if (!storedCode) return;
  run("apiVerifyAdmin", storedCode).then(function (ok) {
    if (ok) { isAdmin = true; adminCode = storedCode; }
    else store("anniv-admin-code", null);
    render();
  }).catch(function () {});
}

if (INITIAL_STATE && Array.isArray(INITIAL_STATE.guests)) {
  applyState(INITIAL_STATE);
  bootAdmin();
  run("apiGetState").then(function (s) {
    if (!busy && pending === 0 && screen !== "who") applyState(s);
  }).catch(function () {});
} else {
  run("apiGetState").then(function (s) {
    applyState(s);
    bootAdmin();
  }).catch(function () {
    document.getElementById("app").innerHTML =
      '<p class="loading">Impossible de charger la liste — recharge la page.</p>';
  });
}

setInterval(function () {
  if (busy || pending > 0 || document.hidden || !loaded) return;
  if (screen === "who") return; // ne pas écraser une saisie en cours
  run("apiGetState").then(function (s) {
    if (!busy && pending === 0 && screen !== "who") applyState(s);
  }).catch(function () {});
}, 45000);
</script>
</body>
</html>
