<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#25412F">
<title>PACS &amp; 60 ans — Charlotte &amp; Antoine</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#25412F; --green2:#2E5941; --terra:#C96A4A; --terra2:#B65B3C;
  --cream:#FAF6EE; --sand:#E9DFCC; --gold:#B08D3E;
  --ink:#23281F; --muted:#7C766A; --oncream-line:rgba(35,40,31,.16);
  --st-oui:#3E7A52; --st-peutetre:#B78428; --st-non:#9B948A;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--green);color:var(--ink);line-height:1.45;min-height:100vh;
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px;border-radius:8px}
body{transition:background .5s ease}

.scr{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr-home{background:var(--green);color:var(--cream)}
.scr-status,.scr-who,.scr-done,.scr-list{background:var(--cream)}
.in{width:100%;max-width:430px;margin:0 auto;padding:0 22px;position:relative}
.top{padding:14px 0 0}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0}
.bottom{padding:0 0 34px}

@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}60%{transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-14px)}}
.a1{animation:rise .7s .1s cubic-bezier(.2,1.1,.3,1) both}
.a2{animation:rise .7s .28s cubic-bezier(.2,1.1,.3,1) both}
.a3{animation:rise .7s .46s cubic-bezier(.2,1.1,.3,1) both}
.a4{animation:rise .7s .64s cubic-bezier(.2,1.1,.3,1) both}
.logo{animation:pop .7s ease both;line-height:0}
.noanim .a1,.noanim .a2,.noanim .a3,.noanim .a4,.noanim .logo{animation:none}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scr{animation:scrIn .4s ease both}
.noanim .scr{animation:none}

/* Le voyage : l'écran quitté glisse dehors, le nouveau arrive avec un rebond */
#app{position:relative;overflow:hidden}
body{overflow-x:hidden}
.scr.trans{position:absolute;inset:0;z-index:1}
/* Zoom-travelling : on traverse l'écran quitté, le nouveau arrive de loin */
.scr{transform-origin:center 42%}
@keyframes voyageOutF{to{opacity:0;transform:scale(1.4) translateX(-7%)}}
@keyframes voyageInF{0%{opacity:0;transform:scale(.68) translateX(8%)}45%{opacity:1}100%{opacity:1;transform:none}}
@keyframes voyageOutB{to{opacity:0;transform:scale(.68) translateX(7%)}}
@keyframes voyageInB{0%{opacity:0;transform:scale(1.4) translateX(-8%)}45%{opacity:1}100%{opacity:1;transform:none}}
.scr.leave-f{animation:voyageOutF .6s cubic-bezier(.5,0,.4,1) both}
.scr.enter-f{animation:voyageInF .8s cubic-bezier(.16,1.08,.26,1) both}
.scr.leave-b{animation:voyageOutB .6s cubic-bezier(.5,0,.4,1) both}
.scr.enter-b{animation:voyageInB .8s cubic-bezier(.16,1.08,.26,1) both}

/* Le guide de la fête : un personnage persistant qui bondit d'écran en
   écran et pointe le prochain bouton à toucher. */
.guide{position:fixed;left:0;top:0;width:58px;height:78px;z-index:60;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 0 4px rgba(250,246,238,.85)) drop-shadow(0 8px 10px rgba(0,0,0,.16))}
.guide svg{width:100%;height:100%;overflow:visible}
.guide svg *{transform-box:view-box}
.eyeG{transform-origin:center;animation:blinkG 4.2s infinite}
@keyframes blinkG{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
.balloonG{transform-origin:51px 36px;animation:balloonFloat 3.4s ease-in-out infinite}
@keyframes balloonFloat{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
.guide .armP{transform-origin:26px 47px}
.guide.g-point svg{animation:guideBob 2.2s ease-in-out infinite}
@keyframes guideBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.guide.g-point .armP{animation:pointJab 1s ease-in-out infinite}
@keyframes pointJab{0%,100%{transform:rotate(0)}45%{transform:rotate(16deg)}}
.guide.g-point .shadowG{animation:shadowPulse 2.2s ease-in-out infinite}
@keyframes shadowPulse{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.85);opacity:.7}}
.guide.g-walk .legA{transform-origin:28px 66px;animation:legSwing .2s linear infinite alternate}
.guide.g-walk .legB{transform-origin:36px 66px;animation:legSwingB .2s linear infinite alternate}
.guide.g-walk .armP{animation:legSwingB .2s linear infinite alternate}
.guide.g-walk .shadowG{opacity:0}
.guide.g-walk svg{animation:runBob .24s linear infinite alternate}
.guide.g-walk.face-l svg{animation-name:runBobL}
@keyframes runBob{from{transform:rotate(7deg)}to{transform:rotate(7deg) translateY(-4px)}}
@keyframes runBobL{from{transform:scaleX(-1) rotate(7deg)}to{transform:scaleX(-1) rotate(7deg) translateY(-4px)}}
@keyframes legSwing{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
@keyframes legSwingB{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}

/* Ses humeurs et ses facéties */
.mouthO,.mouthF{display:none}
.guide .armB{transform-origin:39px 47px}
.g-point .pupils{transform:translate(-1px,.9px)}
.g-peek .pupils{transform:translate(-1.8px,-.8px)}
.g-peek svg{transform:rotate(-5deg)}
.g-peek.g-point svg{animation:none}
.g-wave .armP{animation:waveArm 1.3s ease-in-out 1}
@keyframes waveArm{0%,100%{transform:rotate(0)}30%{transform:rotate(150deg)}50%{transform:rotate(122deg)}70%{transform:rotate(150deg)}}
.g-dance svg{animation:danceWig .48s ease-in-out 3}
@keyframes danceWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) translateY(-3px)}75%{transform:rotate(7deg) translateY(-3px)}}
.g-tug .balloonG{animation:tugB 1.3s ease-in-out 1}
@keyframes tugB{0%,100%{transform:rotate(0)}35%{transform:translateY(7px) rotate(-14deg)}70%{transform:translateY(-4px) rotate(7deg)}}
.g-party svg{animation:partyJump .55s cubic-bezier(.35,0,.4,1) infinite}
@keyframes partyJump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
.g-party .mouthS{display:none}
.g-party .mouthO{display:inline}
.g-party .armP{animation:partyPump 0.55s ease-in-out infinite}
@keyframes partyPump{0%,100%{transform:rotate(125deg)}40%{transform:rotate(145deg)}}
.g-party .armB{transform:rotate(-28deg)}
.g-sad .mouthS{display:none}
.g-sad .mouthF{display:inline}
.g-sad .pupils{transform:translateY(1.4px)}
.g-sad .balloonG{animation:none;transform:translateY(7px) rotate(-6deg)}
.g-sad.g-point .armP{animation-duration:1.9s}
.g-sad.g-point svg{animation-duration:3.4s}

/* Fil du parcours : 3 étapes qui s'allument au fil du trajet */
.steps{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;z-index:2}
.steps .dot{width:9px;height:9px;border-radius:50%;background:var(--sand);flex:none}
.steps .dot.on{background:var(--terra)}
.steps .dot.cur{animation:curPulse 1.6s .4s ease-in-out infinite}
@keyframes curPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,106,74,.5)}50%{box-shadow:0 0 0 8px rgba(201,106,74,0)}}
.steps .seg{width:34px;height:2px;background:var(--sand);position:relative;overflow:hidden;flex:none}
.steps .seg.on::after{content:"";position:absolute;inset:0;background:var(--terra);transform-origin:left;animation:segFill .5s .25s ease both}
@keyframes segFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* La pastille qui fait le trajet d'un écran à l'autre */
.flydot{position:fixed;left:0;top:0;width:20px;height:20px;border-radius:50%;
  background:var(--terra);box-shadow:0 0 0 3px rgba(250,246,238,.55),0 8px 18px rgba(0,0,0,.3);
  z-index:90;pointer-events:none;will-change:transform}

/* Onde au clic */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;
  transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* Chorégraphies d'entrée par écran */
@keyframes popTile{0%{opacity:0;transform:translateY(24px) scale(.75)}60%{transform:translateY(-3px) scale(1.04)}100%{opacity:1;transform:none}}
.count .cd{animation:popTile .55s cubic-bezier(.2,1.2,.3,1) both}
.count .cd:nth-child(1){animation-delay:.4s}
.count .cd:nth-child(2){animation-delay:.5s}
.count .cd:nth-child(3){animation-delay:.6s}
.count .cd:nth-child(4){animation-delay:.7s}
.noanim .count .cd{animation:none}
@keyframes optIn{0%{opacity:0;transform:translateX(var(--from,60px)) rotate(var(--tilt,2deg)) scale(.94)}70%{opacity:1}100%{opacity:1;transform:none}}
.opts .opt{animation:optIn .65s cubic-bezier(.2,1.25,.3,1) both}
.opts .opt:nth-child(1){--from:-72px;--tilt:-2.5deg;animation-delay:.16s}
.opts .opt:nth-child(2){--from:72px;--tilt:2.5deg;animation-delay:.28s}
.noanim .opts .opt{animation:none}
@keyframes cardIn{0%{opacity:0;transform:perspective(700px) rotateX(-26deg) translateY(22px)}100%{opacity:1;transform:none}}
.donecard{transform-origin:top center;animation:cardIn .7s .25s cubic-bezier(.2,1.3,.3,1) both}
.noanim .donecard{animation:none}
.rows .row{animation:rise .45s both}
.rows .row:nth-child(1){animation-delay:.05s}
.rows .row:nth-child(2){animation-delay:.1s}
.rows .row:nth-child(3){animation-delay:.15s}
.rows .row:nth-child(4){animation-delay:.2s}
.rows .row:nth-child(5){animation-delay:.25s}
.rows .row:nth-child(6){animation-delay:.3s}
.rows .row:nth-child(7){animation-delay:.35s}
.rows .row:nth-child(8){animation-delay:.4s}
.noanim .rows .row{animation:none}

/* Aurore de l'écran d'accueil : halos flous qui dérivent lentement */
.aura{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.aura i{position:absolute;border-radius:50%;filter:blur(58px);will-change:transform}
@keyframes auraDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-5vh) scale(1.14)}}
@keyframes auraDrift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vw,6vh) scale(1.08)}}
.aura .g1{width:46vmax;height:46vmax;left:-16vmax;top:-14vmax;background:radial-gradient(circle,rgba(201,106,74,.30),transparent 65%);animation:auraDrift 21s ease-in-out infinite}
.aura .g2{width:40vmax;height:40vmax;right:-14vmax;top:16vh;background:radial-gradient(circle,rgba(176,141,62,.22),transparent 65%);animation:auraDrift2 26s ease-in-out infinite}
.aura .g3{width:36vmax;height:36vmax;left:6vw;bottom:-18vmax;background:radial-gradient(circle,rgba(46,89,65,.55),transparent 65%);animation:auraDrift 30s 2s ease-in-out infinite}

/* Le logo se dessine à l'arrivée */
@keyframes drawStroke{to{stroke-dashoffset:0}}
.logo.draw g path:nth-child(1){stroke-dasharray:350;stroke-dashoffset:350;animation:drawStroke .9s .35s ease forwards}
.logo.draw g path:nth-child(2){stroke-dasharray:180;stroke-dashoffset:180;animation:drawStroke .7s .95s ease forwards}
.logo.draw g path:nth-child(3){stroke-dasharray:44;stroke-dashoffset:44;animation:drawStroke .35s 1.5s ease forwards}
.noanim .logo.draw g path{stroke-dasharray:none;stroke-dashoffset:0;animation:none}

/* Compte à rebours */
.count{display:flex;gap:8px;margin-top:16px}
.cd{flex:1;background:rgba(250,246,238,.07);border:1px solid rgba(250,246,238,.26);border-radius:12px;padding:8px 4px 7px;text-align:center}
.cd .n{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.cd .l{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;opacity:.7;margin-top:3px;font-weight:500}

.madeby{margin-top:6px;text-align:center;font-size:11px;letter-spacing:.1em;opacity:.5;font-weight:300}
.scr-home .grow{padding:16px 0}
.scr-home .linkbtn{margin-top:10px;font-size:13px}
.scr-home .cta{height:52px}
#confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

.serif{font-family:"Cormorant Garamond",Georgia,serif}
.h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:clamp(34px,9.5vw,46px);line-height:1.02;letter-spacing:.01em}
.h1 .amp{font-style:italic;font-weight:500;color:var(--terra)}
.names{margin-top:7px;font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.stitle{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:clamp(30px,8vw,36px);line-height:1.08;overflow-wrap:anywhere}
.lede{margin-top:9px;font-size:14.5px;font-weight:300;line-height:1.45}

.facts{margin-top:16px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.3;font-weight:300}
.fact{display:flex;gap:11px;align-items:center}
.tile{width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:rgba(250,246,238,.1);border:1px solid rgba(250,246,238,.35)}
.tile svg{display:block;width:16px;height:16px}
.fact b{font-weight:500}
.note{margin-top:14px;border:1px solid rgba(250,246,238,.3);border-radius:12px;
  padding:10px 13px;font-size:12px;font-weight:300;line-height:1.45;opacity:.95}
.note b{font-weight:500}

.backbtn{width:44px;height:44px;border-radius:9999px;background:rgba(255,255,255,.55);
  border:1px solid var(--oncream-line);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink)}
.scr-home .backbtn{background:rgba(250,246,238,.12);border-color:rgba(250,246,238,.35);color:var(--cream)}

.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;
  border-radius:9999px;background:var(--green);color:var(--cream);font-size:16px;font-weight:500;
  letter-spacing:.04em;text-decoration:none;transition:opacity .15s,transform .1s}
.cta:hover{opacity:.92;transform:translateY(-1px)}
.cta:active{transform:scale(.985)}
.cta-terra{background:linear-gradient(135deg,#D67A56,#B65B3C);box-shadow:0 12px 26px rgba(0,0,0,.24);position:relative;overflow:hidden}
.cta-terra:hover{opacity:1}
@keyframes sheen{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
.cta-terra::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.32) 50%,transparent 68%);
  transform:translateX(-130%);animation:sheen 3.4s 1.4s ease-in-out infinite}
.cta-ghost{background:transparent;color:var(--ink);border:1px solid var(--oncream-line)}
button:disabled{opacity:.5;cursor:not-allowed}
.small{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.linkbtn{display:block;margin:16px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;padding:4px;text-align:center}
.scr-home .linkbtn{color:rgba(250,246,238,.85)}

.opts{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.opt{display:flex;align-items:center;gap:14px;padding:21px 18px;border-radius:16px;
  background:#fff;border:1px solid var(--sand);text-align:left;width:100%;transition:transform .15s,border-color .15s,box-shadow .2s}
.opt:hover{border-color:var(--green2);transform:translateY(-2px);box-shadow:0 10px 24px rgba(35,40,31,.08)}
.opt:active{transform:scale(.98)}
.opt .col{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .t{font-size:18px;font-weight:500}
.opt .s{font-size:14px;color:var(--muted);font-weight:300}
.opt .arrow{font-size:18px;color:var(--muted)}

.field{width:100%;background:#fff;border:1px solid var(--sand);border-radius:14px;
  padding:13px 16px;font-size:16px;margin-top:14px}
.field::placeholder{color:var(--muted)}
.field:focus{outline:none;border-color:var(--green2)}
.hint{margin-top:9px;font-size:13.5px;color:var(--muted);font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.chips button{background:#fff;border:1px solid var(--sand);border-radius:9999px;
  padding:9px 15px;font-size:14.5px;font-weight:500}
.chips button:hover{border-color:var(--terra);color:var(--terra2)}
.chiplabel{margin-top:14px;font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}

.tpills{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.tpills button{padding:9px 16px;border-radius:9999px;background:#fff;
  border:1px solid var(--sand);font-size:14px;font-weight:500}
.tpills button[aria-pressed=true]{background:var(--green);color:var(--cream);border-color:var(--green)}

.plusrow{display:flex;align-items:center;gap:12px;margin-top:16px;padding:0 2px}
.plusrow .col{flex:1;display:flex;flex-direction:column;gap:2px}
.plusrow .t{font-size:16px;font-weight:500}
.plusrow .s{font-size:13px;color:var(--muted);font-weight:300}
.step{display:flex;align-items:center;gap:12px;flex:none}
.step button{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--sand);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;line-height:1}
.step .n{font-size:21px;font-weight:500;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}

.donecard{margin-top:16px;background:#fff;border:1px solid var(--sand);border-radius:16px;
  padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.doneline{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.doneline .k{color:var(--muted);font-weight:300}
.doneline .v{font-weight:500;text-align:right}
.thanks{margin-top:10px;font-size:14.5px;font-weight:300;line-height:1.5}
.scr-done .grow{padding:14px 0}
.scr-done .bottom{padding-bottom:20px}
.scr-done .cta{height:50px}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filters button{flex:none;padding:7px 14px;border-radius:9999px;background:#fff;
  border:1px solid var(--sand);font-size:13.5px}
.filters button[aria-pressed=true]{background:var(--green);color:var(--cream);border-color:var(--green);font-weight:500}
/* La page liste ne défile jamais : seule la liste de noms défile à l'intérieur */
.scr-list{height:100vh;height:100svh}
.listwrap{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:10px;padding-bottom:14px}
.scr-list .stitle{font-size:26px}
.rows{flex:1 1 auto;min-height:0;overflow-y:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sand);flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;font-size:12.5px;font-weight:500;color:var(--cream);
  display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.03em}
.row .who{flex:1;min-width:120px;display:flex;flex-direction:column}
.row .nm{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.row .mt{font-size:13px;color:var(--muted);font-weight:300}
.stw{font-weight:500}
.st-oui .stw{color:var(--st-oui)}
.st-peutetre .stw{color:var(--st-peutetre)}
.st-non .stw{color:var(--st-non)}
.pluspill{font-size:12.5px;font-weight:500;color:var(--cream);padding:4px 9px;border-radius:9999px;flex:none}
.rowgo{cursor:pointer;position:relative;transition:background .15s}
.rowgo:hover{background:rgba(255,255,255,.55)}
.row .chev{color:var(--muted);font-size:19px;flex:none;padding-left:2px}
.empty{padding:26px 0;color:var(--muted);font-size:15px;font-weight:300}
.total{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--oncream-line);flex:none}
.total .col{flex:1;display:flex;flex-direction:column}
.total .t{font-size:15px;font-weight:500}
.total .s{font-size:13px;color:var(--muted);font-weight:300}

.seg{display:flex;border:1px solid var(--sand);border-radius:9999px;overflow:hidden;background:#fff}
.seg button{padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button + button{border-left:1px solid var(--sand)}
.seg button[aria-pressed=true]{background:var(--green);color:var(--cream)}

// —— Configuration Supabase ——
var SUPABASE_URL = "https://mfkeflxuvshfgarzwfxf.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_Dc8LEFPjghFF_Gs3M7pvKg_L0pv1rIx";

function rpc(name, body) {
  var headers = { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  if (SUPABASE_ANON_KEY.indexOf("eyJ") === 0) {
    headers["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;
  }
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: headers,
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (data) {
      if (!r.ok) {
        throw new Error((data && (data.message || data.hint || data.error_description)) || "Erreur serveur — réessaie.");
      }
      return data;
    });
  });
}

var API = {
  apiGetState: function () { return rpc("get_state", {}); },
  apiRsvp: function (name, camp, plus, clientId, status) {
    return rpc("rsvp", { p_name: name, p_camp: camp, p_plus: plus, p_client_id: clientId, p_status: status });
  },
  apiVerifyAdmin: function (code) { return rpc("verify_admin", { p_code: code }); },
  apiAdmin: function (code, op, payload) {
    return rpc("admin_op", { p_code: code, p_op: op, p_payload: payload || {} });
  }
};
function run(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return API[fn].apply(null, args);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function norm(s) {
  return String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function initials(name) {
  var parts = String(name).trim().split(/\s+/).slice(0, 2);
  return parts.map(function (p) { return p.charAt(0).toUpperCase(); }).join("") || "?";
}
function store(key, val) {
  try {
    if (val === null) localStorage.removeItem(key);
    else localStorage.setItem(key, val);
  } catch (e) {}
}
function read(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function setMe(id) { meId = id; store("anniv-me", id); }
function me_() {
  return meId ? state.guests.find(function (g) { return g.id === meId; }) : null;
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function daysLeft() {
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(PARTY.y, PARTY.m, PARTY.d) - today) / 86400000);
}

function overlay(msg) {
  hideOverlay();
  var el = document.createElement("div");
  el.className = "overlay";
  el.id = "overlay";
  var inner = document.createElement("div");
  inner.textContent = msg;
  el.appendChild(inner);
  document.body.appendChild(el);
}
function hideOverlay() {
  var el = document.getElementById("overlay");
  if (el) el.remove();
}
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 4500);
}

function applyState(s) {
  if (s && Array.isArray(s.guests)) state = s;
  try { localStorage.setItem("anniv-cache", JSON.stringify(state)); } catch (e) {}
  loaded = true;
  if (meId && !state.guests.some(function (g) { return g.id === meId; })) setMe(null);
  render();
}

function errMsg(err) {
  return (err && err.message ? err.message : "Ça n'a pas marché — réessaie.").replace(/^(Error|Exception):\s*/, "");
}

function act(promiseFactory, waitMsg) {
  if (busy) return;
  busy = true;
  render();
  overlay(waitMsg || "On note ça…");
  promiseFactory().then(function (result) {
    busy = false;
    hideOverlay();
    if (result && result.state) {
      if (result.meId) setMe(result.meId);
      applyState(result.state);
    } else {
      applyState(result);
    }
  }).catch(function (err) {
    busy = false;
    hideOverlay();
    render();
    toast(errMsg(err));
  });
}

// Action optimiste : l'écran change tout de suite, le serveur suit derrière.
function optimistic(mutate, promiseFactory) {
  var snapshot = JSON.parse(JSON.stringify(state));
  mutate(state);
  render();
  pending++;
  promiseFactory().then(function (result) {
    pending--;
    var s = result && result.state ? result.state : result;
    if (pending === 0 && !busy) applyState(s);
  }).catch(function (err) {
    pending--;
    state = snapshot;
    render();
    toast(errMsg(err));
  });
}

function counts() {
  var g = state.guests;
  var oui = g.filter(function (x) { return x.status === "oui"; });
  var plus = oui.reduce(function (t, x) { return t + (x.plus || 0); }, 0);
  return {
    oui: oui.length,
    non: g.filter(function (x) { return x.status === "non"; }).length,
    plus: plus,
    total: oui.length + plus
  };
}

var guideEl = null, guidePos = null, guideTimer = null, guideAnim = null;
var guideMood = "happy", trickTimer = null, peekTimer = null;

function ensureGuide() {
  if (guideEl) return;
  guideEl = document.createElement("span");
  guideEl.className = "guide";
  guideEl.setAttribute("aria-hidden", "true");
  guideEl.innerHTML = GUIDE_SVG;
  document.body.appendChild(guideEl);
  guidePos = { x: -80, y: window.innerHeight - 210 };
  guideEl.style.transform = "translate(" + guidePos.x + "px," + guidePos.y + "px)";
  scheduleTrick();
}

// Quand il attend, il fait des petites facéties de temps en temps.
function scheduleTrick() {
  clearTimeout(trickTimer);
  trickTimer = setTimeout(doTrick, 3200 + Math.random() * 3200);
}
function doTrick() {
  var busyGuide = !guideEl || !guideEl.classList.contains("g-point") ||
    guideMood === "sad" || guideEl.classList.contains("g-party") || guideEl.classList.contains("g-peek");
  if (!busyGuide) {
    var tricks = ["g-wave", "g-dance", "g-tug", "hop"];
    var pick = tricks[Math.floor(Math.random() * tricks.length)];
    if (pick === "hop" && guideEl.firstElementChild.animate) {
      guideEl.firstElementChild.animate(
        [{ transform: "translateY(0)" }, { transform: "translateY(-22px)" }, { transform: "translateY(0)" },
         { transform: "translateY(-11px)" }, { transform: "translateY(0)" }],
        { duration: 700, easing: "ease-in-out" });
    } else if (pick !== "hop") {
      guideEl.classList.add(pick);
      (function (cls) { setTimeout(function () { guideEl.classList.remove(cls); }, 1500); })(pick);
    }
  }
  scheduleTrick();
}

// Il jette un œil quand on tape son prénom.
function guidePeek() {
  if (!guideEl) return;
  guideEl.classList.add("g-peek");
  clearTimeout(peekTimer);
  peekTimer = setTimeout(function () { guideEl.classList.remove("g-peek"); }, 900);
}

function setGuideMood(mood) {
  guideMood = mood;
  if (guideEl) guideEl.classList.toggle("g-sad", mood === "sad");
}

// Après chaque rendu, le guide bondit jusqu'au prochain bouton et le pointe.
function guideGo(delay) {
  if (!document.body.animate) return;
  ensureGuide();
  if (guideTimer) clearTimeout(guideTimer);
  guideTimer = setTimeout(placeGuide, delay);
}

function placeGuide() {
  var app = document.getElementById("app");
  var scr = app && app.lastElementChild;
  var sels = {
    home: ".cta-terra",
    status: ".opts .opt",
    who: 'form[data-form="who"] button[type="submit"]',
    done: ".bottom .cta"
  };
  var t = scr && sels[screen] ? scr.querySelector(sels[screen]) : null;
  var W = window.innerWidth, H = window.innerHeight;
  var x, y, point = true;
  if (!t) {
    x = -90; y = H - 210; point = false;
  } else {
    var r = t.getBoundingClientRect();
    // perché sur le bord droit du bouton, l'index tendu vers lui
    x = Math.max(8, Math.min(W - 62, r.right - 40));
    y = r.top - 70;
    if (y < 6) y = Math.min(H - 100, r.bottom + 8);
  }
  walkGuide(x, y, point);
}

function walkGuide(x, y, point) {
  var dx = x - guidePos.x, dy = y - guidePos.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 4) { guideEl.classList.toggle("g-point", point); return; }
  if (guideAnim) guideAnim.cancel();
  guideEl.classList.remove("g-point");
  guideEl.classList.add("g-walk");
  guideEl.classList.toggle("face-l", dx < 0);
  var hops = Math.max(1, Math.round(dist / 230));
  var amp = Math.min(64, 26 + dist / 8);
  var x0 = guidePos.x, y0 = guidePos.y, kf = [];
  for (var i = 0; i <= 24; i++) {
    var t = i / 24;
    var px = x0 + dx * t;
    var py = y0 + dy * t - amp * Math.abs(Math.sin(t * Math.PI * hops));
    kf.push({ transform: "translate(" + px + "px," + py + "px)" });
  }
  guidePos = { x: x, y: y };
  guideEl.style.transform = "translate(" + x + "px," + y + "px)";
  guideAnim = guideEl.animate(kf, {
    duration: Math.max(480, Math.min(1150, dist * 1.4)),
    easing: "cubic-bezier(.45,.05,.4,1)"
  });
  guideAnim.onfinish = function () {
    guideEl.classList.remove("g-walk", "face-l");
    guideEl.classList.toggle("g-point", point);
    guideAnim = null;
    // Arrivé sur l'écran de merci après un oui : il fait la fête avant de pointer.
    if (point && screen === "done" && guideMood !== "sad") {
      guideEl.classList.add("g-party");
      setTimeout(function () { if (guideEl) guideEl.classList.remove("g-party"); }, 2600);
    }
  };
}

function partyDate() { return new Date(PARTY.y, PARTY.m, PARTY.d, 18, 30, 0); }

function countdownHtml() {
  if (partyDate().getTime() - Date.now() <= 0) return "";
  return '<div class="count a2" aria-label="Compte à rebours">' +
    '<div class="cd"><span class="n" id="cd-j">&nbsp;</span><span class="l">jours</span></div>' +
    '<div class="cd"><span class="n" id="cd-h">&nbsp;</span><span class="l">heures</span></div>' +
    '<div class="cd"><span class="n" id="cd-m">&nbsp;</span><span class="l">min</span></div>' +
    '<div class="cd"><span class="n" id="cd-s">&nbsp;</span><span class="l">sec</span></div></div>';
}

var cdTimer = null;
function tickCountdown() {
  var el = document.getElementById("cd-j");
  if (!el) { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } return; }
  var diff = Math.max(0, partyDate().getTime() - Date.now());
  var s = Math.floor(diff / 1000);
  var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
  el.textContent = Math.floor(s / 86400);
  document.getElementById("cd-h").textContent = pad(Math.floor(s / 3600) % 24);
  document.getElementById("cd-m").textContent = pad(Math.floor(s / 60) % 60);
  document.getElementById("cd-s").textContent = pad(s % 60);
}

function confettiBurst() {
  if (reducedMotion()) return;
  var old = document.getElementById("confetti-canvas");
  if (old) old.remove();
  var cv = document.createElement("canvas");
  cv.id = "confetti-canvas";
  document.body.appendChild(cv);
  var ctx = cv.getContext("2d");
  var W = cv.width = window.innerWidth;
  var H = cv.height = window.innerHeight;
  var colors = ["#C96A4A", "#B08D3E", "#2E5941", "#E9C87E", "#FAF6EE"];
  var parts = [];
  for (var i = 0; i < 130; i++) {
    var left = i % 2 === 0;
    parts.push({
      x: left ? -12 : W + 12,
      y: H * (0.25 + Math.random() * 0.4),
      vx: (left ? 1 : -1) * (3.5 + Math.random() * 6),
      vy: -(5 + Math.random() * 7),
      g: 0.18 + Math.random() * 0.1,
      w: 5 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      c: colors[i % colors.length],
      round: i % 5 === 0
    });
  }
  var t0 = performance.now();
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    // (particules de confettis)
    ctx.globalAlpha = Math.min(1, Math.max(0, 1 - (t - t0 - 1900) / 700));
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.99; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.3); ctx.fill(); }
      else { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    });
    if (t - t0 < 2600) requestAnimationFrame(frame);
    else cv.remove();
  }
  requestAnimationFrame(frame);
}

// La pastille terracotta qui fait le trajet du doigt vers l'écran suivant.
function flyDot(x, y) {
  if (reducedMotion() || !document.body.animate) return;
  var d = document.createElement("span");
  d.className = "flydot";
  document.body.appendChild(d);
  var tx = 46, ty = 92;
  var cx = (x + tx) / 2, cy = Math.min(y, ty) - 170;
  var kf = [];
  for (var i = 0; i <= 20; i++) {
    var t = i / 20;
    var px = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * cx + t * t * tx;
    var py = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * cy + t * t * ty;
    kf.push({
      transform: "translate(" + (px - 10) + "px," + (py - 10) + "px) scale(" + (1 - 0.45 * t) + ")",
      opacity: t < 0.8 ? 1 : 1 - (t - 0.8) / 0.2
    });
  }
  var anim = d.animate(kf, { duration: 620, easing: "cubic-bezier(.3,.1,.3,1)" });
  anim.onfinish = function () { d.remove(); };
  setTimeout(function () { if (d.parentNode) d.remove(); }, 800);
}

// Onde circulaire depuis le point de clic.
function spawnRipple(btn, ev) {
  if (reducedMotion()) return;
  var r = btn.getBoundingClientRect();
  if (!r.width) return;
  var d = Math.max(r.width, r.height) * 2;
  var s = document.createElement("span");
  s.className = "ripple";
  s.style.width = s.style.height = d + "px";
  s.style.left = ((ev.clientX || r.left + r.width / 2) - r.left - d / 2) + "px";
  s.style.top = ((ev.clientY || r.top + r.height / 2) - r.top - d / 2) + "px";
  var cs = getComputedStyle(btn);
  if (cs.position === "static") btn.style.position = "relative";
  if (cs.overflow !== "hidden") btn.style.overflow = "hidden";
  btn.appendChild(s);
  setTimeout(function () { if (s.parentNode) s.remove(); }, 550);
}

var lastScreen = null;
var DEPTH = { home: 0, status: 1, who: 2, done: 3, list: 4 };
// La fête prime : on anime même si le système demande de réduire les animations.
function reducedMotion() { return false; }
function render() {
  if (!loaded) return;
  var app = document.getElementById("app");
  var sameScreen = screen === lastScreen;
  var prevScreen = lastScreen;
  lastScreen = screen;
  app.classList.toggle("noanim", sameScreen);
  document.body.style.background = SCREEN_BG[screen] || SCREEN_BG.home;
  var html;
  if (screen === "home") html = renderHome();
  else if (screen === "status") html = renderStatus();
  else if (screen === "who") html = renderWho();
  else if (screen === "done") html = renderDone();
  else html = renderList();

  var old = app.firstElementChild;
  if (!sameScreen && prevScreen && old && old.classList && old.classList.contains("scr") && !reducedMotion()) {
    // Voyage : l'ancien écran glisse dehors pendant que le nouveau arrive.
    var dir = (DEPTH[screen] || 0) >= (DEPTH[prevScreen] || 0) ? "f" : "b";
    Array.prototype.forEach.call(old.querySelectorAll("[id]"), function (el) { el.removeAttribute("id"); });
    while (old.nextElementSibling) old.nextElementSibling.remove();
    old.classList.remove("enter-f", "enter-b");
    old.classList.add("trans", "leave-" + dir);
    old.style.pointerEvents = "none";
    app.insertAdjacentHTML("beforeend", html);
    app.lastElementChild.classList.add("enter-" + dir);
    setTimeout(function () { if (old.parentNode) old.remove(); }, 620);
  } else {
    app.innerHTML = html;
  }

  var scrEl = app.lastElementChild;
  var editInput = scrEl && scrEl.querySelector("[data-edit-input]");
  if (editInput) { editInput.focus(); editInput.select(); }
  if (adminOpen && !isAdmin) {
    var codeInput = document.getElementById("admin-code");
    if (codeInput) codeInput.focus();
  }
  if (screen === "home") {
    tickCountdown();
    if (!cdTimer) cdTimer = setInterval(tickCountdown, 1000);
  } else if (cdTimer) {
    clearInterval(cdTimer);
    cdTimer = null;
  }
  if (screen === "done" && !sameScreen) {
    var doneMe = me_();
    if (doneMe && doneMe.status === "oui") confettiBurst();
  }
  if (!sameScreen) window.scrollTo(0, 0);
  guideGo(sameScreen ? 80 : 1300);
}

function goTo(s) {
  screen = s;
  render();
}

/* ----------------------------- Interactions ------------------------------ */

document.getElementById("app").addEventListener("click", function (ev) {
  var btn = ev.target.closest("[data-act]");
  if (!btn || busy) return;
  var actName = btn.getAttribute("data-act");
  var id = btn.getAttribute("data-id");
  if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
  spawnRipple(btn, ev);
  if (actName === "goto" || actName === "pick-status" || actName === "restart" || actName === "row-rsvp") {
    var br = btn.getBoundingClientRect();
    flyDot(ev.clientX || br.left + br.width / 2, ev.clientY || br.top + br.height / 2);
  }
  if (actName === "row-rsvp") {
    var rowGuest = state.guests.find(function (g) { return g.id === id; });
    if (rowGuest) {
      meId = rowGuest.id;
      joinName = rowGuest.name;
      joinCamp = rowGuest.camp;
      plusDraft = rowGuest.plus || 0;
      setGuideMood("happy");
      goTo("status");
    }
  } else if (actName === "goto") {
    goTo(btn.getAttribute("data-screen"));
  } else if (actName === "share") {
    var shareUrl = location.href.split("#")[0].split("?")[0];
    var shareData = { title: "PACS & 60 ans — Charlotte & Antoine", text: "Réponds à l’invitation pour le 17 octobre \u{1F942}", url: shareUrl };
    if (navigator.share) {
      navigator.share(shareData).catch(function () {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareUrl).then(function () { toast("Lien copié — envoie-le à qui tu veux ✨"); }, function () { toast(shareUrl); });
    } else {
      toast(shareUrl);
    }
  } else if (actName === "restart") {
    goTo("status");
  } else if (actName === "pick-status") {
    pendingStatus = btn.getAttribute("data-status");
    setGuideMood(pendingStatus === "non" ? "sad" : "happy");
    var me = me_();
    joinName = me ? me.name : joinName;
    joinCamp = me ? me.camp : joinCamp;
    plusDraft = me ? (me.plus || 0) : plusDraft;
    goTo("who");
  } else if (actName === "pick-name") {
    var picked = state.guests.find(function (g) { return g.id === id; });
    if (picked) {
      joinName = picked.name;
      joinCamp = picked.camp;
      plusDraft = picked.plus || 0;
      render();
    }
  } else if (actName === "who-camp") {
    joinCamp = btn.getAttribute("data-camp");
    render();
  } else if (actName === "who-plus-inc" || actName === "who-plus-dec") {
    var next = plusDraft + (actName === "who-plus-inc" ? 1 : -1);
    if (next < 0 || next > MAX_PLUS) return;
    plusDraft = next;
    render();
  } else if (actName === "filter") {
    filter = btn.getAttribute("data-filter");
    render();
  } else if (actName === "admin-open") {
    adminOpen = true;
    render();
  } else if (actName === "admin-close") {
    adminOpen = false;
    render();
  } else if (actName === "admin-off") {
    isAdmin = false;
    adminOpen = false;
    adminCode = null;
    store("anniv-admin-code", null);
    editingId = null;
    armedDeleteId = null;
    render();
  } else if (actName === "status") {
    if (!isAdmin) return;
    var s2 = btn.getAttribute("data-status");
    optimistic(function (s) {
      var g = s.guests.find(function (x) { return x.id === id; });
      if (g) g.status = s2;
    }, function () { return run("apiAdmin", adminCode, "status", { id: id, status: s2 }); });
  } else if (actName === "plus-cycle") {
    if (!isAdmin) return;
    var cur = parseInt(btn.getAttribute("data-plus"), 10) || 0;
    var nxt = (cur + 1) % (MAX_PLUS + 1);
    optimistic(function (s) {
      var g = s.guests.find(function (x) { return x.id === id; });
      if (g) g.plus = nxt;
    }, function () { return run("apiAdmin", adminCode, "plus", { id: id, plus: nxt }); });
  } else if (actName === "edit") {
    if (!isAdmin) return;
    editingId = id;
    armedDeleteId = null;
    render();
  } else if (actName === "cancel-edit") {
    editingId = null;
    render();
  } else if (actName === "del") {
    if (!isAdmin) return;
    if (armedDeleteId === id) {
      clearTimeout(armedTimer);
      armedDeleteId = null;
      editingId = null;
      optimistic(function (s) {
        s.guests = s.guests.filter(function (x) { return x.id !== id; });
      }, function () { return run("apiAdmin", adminCode, "del", { id: id }); });
    } else {
      armedDeleteId = id;
      render();
      clearTimeout(armedTimer);
      armedTimer = setTimeout(function () {
        if (armedDeleteId === id) { armedDeleteId = null; render(); }
      }, 4000);
    }
  }
});

document.getElementById("app").addEventListener("input", function (ev) {
  var t = ev.target;
  if (!t) return;
  if (t.id === "guest-name") {
    draftName = t.value;
  } else if (t.id === "who-name") {
    joinName = t.value;
    var sug = document.getElementById("who-sug");
    if (sug) sug.innerHTML = whoSugHtml();
    guidePeek();
  }
});

document.getElementById("app").addEventListener("submit", function (ev) {
  var form = ev.target.closest("[data-form]");
  if (!form) return;
  ev.preventDefault();
  if (busy) return;
  var kind = form.getAttribute("data-form");
  if (kind === "who") {
    var name = joinName.trim();
    if (norm(name).length < 2) { toast("Écris ton prénom (au moins 2 lettres)."); return; }
    var vbtn = form.querySelector('[type="submit"]');
    if (vbtn) {
      var vr = vbtn.getBoundingClientRect();
      flyDot(vr.left + vr.width / 2, vr.top + vr.height / 2);
    }
    var st = pendingStatus;
    var camp = joinCamp;
    var plus = pendingStatus === "oui" ? plusDraft : 0;
    // Optimiste : si le nom existe on met à jour, sinon on l'ajoute — l'écran
    // de confirmation s'affiche tout de suite, le serveur fait pareil derrière.
    var snapshot = JSON.parse(JSON.stringify(state));
    var prevMe = meId;
    var prevScreen = screen;
    var match = state.guests.find(function (g) { return norm(g.name) === norm(name); });
    var targetId = match ? match.id : uid();
    if (match) {
      match.status = st;
      match.camp = camp;
      match.plus = plus;
    } else {
      state.guests.push({ id: targetId, name: name, camp: camp, status: st, plus: plus, updated: new Date().toISOString() });
    }
    setMe(targetId);
    screen = "done";
    render();
    pending++;
    run("apiRsvp", name, camp, plus, targetId, st).then(function (result) {
      pending--;
      if (result && result.meId) setMe(result.meId);
      var s = result && result.state ? result.state : result;
      if (pending === 0 && !busy) applyState(s);
    }).catch(function (err) {
      pending--;
      state = snapshot;
      setMe(prevMe);
      screen = prevScreen;
      render();
      toast(errMsg(err));
    });
  } else if (kind === "unlock") {
    var input = document.getElementById("admin-code");
    var code = (input && input.value) || "";
    if (!code) return;
    act(function () {
      return run("apiVerifyAdmin", code).then(function (ok) {
        if (!ok) throw new Error("Code organisateurs incorrect.");
        isAdmin = true;
        adminOpen = false;
        adminCode = code;
        store("anniv-admin-code", code);
        return run("apiGetState");
      });
    }, "Vérification…");
  } else if (kind === "code") {
    if (!isAdmin) return;
    var nc = document.getElementById("admin-newcode");
    var newCode = ((nc && nc.value) || "").trim();
    if (newCode.length < 4) { toast("Le code doit faire au moins 4 caractères."); return; }
    act(function () {
      return run("apiAdmin", adminCode, "code", { code: newCode }).then(function (s) {
        adminCode = newCode;
        store("anniv-admin-code", newCode);
        toast("Code organisateurs changé.");
        return s;
      });
    });
  } else if (kind === "add") {
    if (!isAdmin) return;
    var gname = (document.getElementById("guest-name").value || "").trim();
    if (!gname) { toast("Il manque le prénom."); return; }
    var acamp = draftCamp;
    draftName = "";
    act(function () { return run("apiAdmin", adminCode, "add", { name: gname, camp: acamp }); });
  } else if (kind === "rename") {
    if (!isAdmin) return;
    var rid = form.getAttribute("data-id");
    var rin = form.querySelector("[data-edit-input]");
    var rname = (rin.value || "").trim();
    if (!rname) { toast("Le nom ne peut pas être vide."); return; }
    editingId = null;
    act(function () { return run("apiAdmin", adminCode, "rename", { id: rid, name: rname }); });
  }
});

/* -------------------------------- Boot ----------------------------------- */

meId = read("anniv-me");
var storedCode = read("anniv-admin-code");

function bootAdmin() {
  if (!storedCode) return;
  run("apiVerifyAdmin", storedCode).then(function (ok) {
    if (ok) { isAdmin = true; adminCode = storedCode; }
    else store("anniv-admin-code", null);
    render();
  }).catch(function () {});
}

if (INITIAL_STATE && Array.isArray(INITIAL_STATE.guests)) {
  applyState(INITIAL_STATE);
  bootAdmin();
  run("apiGetState").then(function (s) {
    if (!busy && pending === 0 && screen !== "who") applyState(s);
  }).catch(function () {});
} else {
  run("apiGetState").then(function (s) {
    applyState(s);
    bootAdmin();
  }).catch(function () {
    document.getElementById("app").innerHTML =
      '<p class="loading">Impossible de charger la liste — recharge la page.</p>';
  });
}

setInterval(function () {
  if (busy || pending > 0 || document.hidden || !loaded) return;
  if (screen === "who") return; // ne pas écraser une saisie en cours
  run("apiGetState").then(function (s) {
    if (!busy && pending === 0 && screen !== "who") applyState(s);
  }).catch(function () {});
}, 45000);
</script>
