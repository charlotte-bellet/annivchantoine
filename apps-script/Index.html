<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anniv Charlotte &amp; Antoine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF6EC; --card:#FFFFFF; --ink:#463A4B; --muted:#9A8AA0;
  --line:#F3E4DC; --accent:#F4578C; --accent-soft:#FFE9F0;
  --charlotte:#F4578C; --antoine:#4FA3D9; --deux:#9B7EDB;
  --ok:#2FA96C; --ok-soft:#E2F6EB; --maybe:#E8960C; --maybe-soft:#FFF3DC;
  --off:#9A8AA0; --off-soft:#F1EDF3; --danger:#E0526B;
  --shadow:0 6px 24px rgba(90,60,80,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#2A2230; --card:#372C3E; --ink:#F7EFF4; --muted:#BCA8C4;
    --line:#4C3E55; --accent:#FF7FA6; --accent-soft:#4A3341;
    --charlotte:#FF7FA6; --antoine:#77BCE8; --deux:#B79AE8;
    --ok:#5ECD92; --ok-soft:#2F4237; --maybe:#F0B457; --maybe-soft:#4A3D2B;
    --off:#BCA8C4; --off-soft:#443A4B; --danger:#F08498;
    --shadow:0 6px 24px rgba(0,0,0,.3);
  }
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

.wrap{max-width:520px;margin:0 auto;padding:30px 16px 56px}
.hero{text-align:center;margin-bottom:20px}
.cake{font-size:3rem;line-height:1}
.hero h1{font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:800;
  font-size:clamp(1.8rem,7.5vw,2.4rem);line-height:1.1;margin-top:4px}
.hero .date{margin-top:4px;font-weight:800;color:var(--accent);font-size:1.05rem}
.hero .jj{color:var(--muted);font-weight:600;font-size:.9rem}

.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.cardtitle{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.3rem;margin-bottom:12px}

.hello{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.5rem;overflow-wrap:anywhere}
.team{color:var(--muted);font-weight:700;font-size:.9rem;margin-top:2px}
.team.c-charlotte{color:var(--charlotte)} .team.c-antoine{color:var(--antoine)} .team.c-deux{color:var(--deux)}
.question{font-weight:800;margin:16px 0 10px}

input[type=text],input[type=password]{width:100%;border:2px solid var(--line);border-radius:16px;
  padding:13px 16px;background:var(--bg);font-weight:700}
input::placeholder{color:var(--muted);opacity:.8;font-weight:600}
input:focus{border-color:var(--accent);outline:none}
.hint{color:var(--muted);font-size:.9rem;margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{background:var(--accent-soft);color:var(--accent);border-radius:999px;
  padding:10px 18px;font-weight:800;transition:transform .1s}
.chips button:active{transform:scale(.96)}
.chiplabel{font-weight:800;margin-top:14px}

.big{display:flex;flex-direction:column;gap:10px}
@media (min-width:460px){.big{flex-direction:row}.big button{flex:1}}
.big button{border-radius:18px;padding:15px 12px;font-weight:800;font-size:1.05rem;
  background:var(--bg);border:2px solid var(--line);transition:transform .1s,background .15s,border-color .15s}
.big button:active{transform:scale(.97)}
.big .b-oui[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.big .b-peutetre[aria-pressed=true]{background:var(--maybe-soft);border-color:var(--maybe);color:var(--maybe)}
.big .b-non[aria-pressed=true]{background:var(--off-soft);border-color:var(--off);color:var(--off)}

.teamseg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.teamseg button{flex:1;min-width:96px;border-radius:14px;padding:10px 6px;font-weight:800;
  font-size:.92rem;background:var(--bg);border:2px solid var(--line)}
.teamseg .c-charlotte[aria-pressed=true]{color:var(--charlotte);border-color:var(--charlotte)}
.teamseg .c-antoine[aria-pressed=true]{color:var(--antoine);border-color:var(--antoine)}
.teamseg .c-deux[aria-pressed=true]{color:var(--deux);border-color:var(--deux)}

.go{width:100%;margin-top:14px;background:var(--accent);color:#fff;border-radius:18px;
  padding:15px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.15rem;
  transition:transform .1s,filter .15s}
.go:hover{filter:brightness(1.06)}
.go:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{display:block;margin:14px auto 0;color:var(--muted);font-size:.9rem;
  font-weight:700;text-decoration:underline;padding:4px}

.listhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.listhead h2{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.3rem}
.listhead span{color:var(--muted);font-weight:700;font-size:.9rem}
.moodline{color:var(--muted);font-weight:700;font-size:.92rem;margin-bottom:12px}
.guests{list-style:none;display:flex;flex-direction:column}
.guest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 4px;border-top:2px solid var(--line)}
.gwho{flex:1;min-width:120px}
.gname{font-weight:800;overflow-wrap:anywhere}
.gteam{font-size:.8rem;font-weight:700;color:var(--muted)}
.gteam.c-charlotte{color:var(--charlotte)} .gteam.c-antoine{color:var(--antoine)} .gteam.c-deux{color:var(--deux)}
.mood{font-weight:800;font-size:.95rem}
.mood.p-oui{color:var(--ok)} .mood.p-peutetre{color:var(--maybe)} .mood.p-non{color:var(--off)}
.empty{text-align:center;color:var(--muted);padding:20px;font-weight:700}

.seg{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:6px 10px;font-size:.82rem;font-weight:800;color:var(--muted)}
.seg button + button{border-left:2px solid var(--line)}
.seg .s-oui[aria-pressed=true]{background:var(--ok);color:#fff}
.seg .s-peutetre[aria-pressed=true]{background:var(--maybe);color:#fff}
.seg .s-non[aria-pressed=true]{background:var(--off);color:#fff}
.gtools{display:flex;gap:2px}
.gtools button{color:var(--muted);border-radius:10px;padding:5px 8px;font-size:1rem;line-height:1}
.gtools .armed{color:var(--danger);font-size:.8rem;font-weight:800}
.editrow{display:flex;gap:6px;flex:1;min-width:200px}
.editrow input{flex:1;min-width:0;padding:9px 12px;border-radius:12px}
.editrow button{border-radius:12px;padding:8px 12px;font-weight:800}
.editrow .ok{background:var(--accent);color:#fff}
.editrow .no{color:var(--muted)}
.addform{margin-bottom:16px;padding-bottom:16px;border-bottom:2px dashed var(--line)}

.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:.85rem;
  font-weight:600;display:flex;flex-direction:column;gap:8px;align-items:center}
.orga{color:var(--muted);font-size:.82rem;font-weight:700;text-decoration:underline;padding:4px}
.adminbox{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--card);
  border-radius:18px;padding:12px;box-shadow:var(--shadow);max-width:100%}
.adminbox input{width:190px;padding:9px 12px;border-radius:12px}
.adminbox button{background:var(--accent);color:#fff;border-radius:12px;padding:9px 14px;font-weight:800}
.adminbox .quiet{background:none;color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(50,30,45,.4);display:flex;
  align-items:center;justify-content:center;z-index:50}
.overlay div{background:var(--card);color:var(--ink);border-radius:18px;padding:16px 26px;
  font-weight:800;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 20px;
  font-size:.95rem;font-weight:800;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.loading{text-align:center;color:var(--muted);padding:70px 20px;font-weight:800}
</style>
</head>
<body>
<div id="app"><p class="loading">🎈 Chargement de la liste…</p></div>
<script>
"use strict";

var PARTY = { y: 2026, m: 9, d: 17 };
var TEAMS = {
  charlotte: { label: "Team Charlotte", cls: "c-charlotte" },
  antoine:   { label: "Team Antoine",   cls: "c-antoine" },
  deux:      { label: "Les deux !",     cls: "c-deux" }
};
var BIG = { oui: "🎉 Oui, je viens !", peutetre: "🤔 Peut-être", non: "😢 Je peux pas" };
var MOODS = { oui: "🎉 Présent·e", peutetre: "🤔 Peut-être", non: "😢 Absent·e" };
var SEG = { oui: "Oui", peutetre: "Peut-être", non: "Non" };

var state = { guests: [], updated: "" };
var loaded = false;
var busy = false;
var isAdmin = false;
var adminOpen = false;
var adminCode = null;
var editingId = null;
var armedDeleteId = null;
var armedTimer = null;
var draftName = "";
var draftCamp = "charlotte";
var joinName = "";
var joinCamp = "charlotte";
var meId = null;

function run(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    runner[fn].apply(runner, args);
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function norm(s) {
  return String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function store(key, val) {
  try {
    if (val === null) localStorage.removeItem(key);
    else localStorage.setItem(key, val);
  } catch (e) {}
}
function read(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function setMe(id) { meId = id; store("anniv-me", id); }

function daysLeft() {
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(PARTY.y, PARTY.m, PARTY.d) - today) / 86400000);
}
function fmtUpdated(iso) {
  try {
    var d = new Date(iso);
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) +
      " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return ""; }
}

function overlay(msg) {
  hideOverlay();
  var el = document.createElement("div");
  el.className = "overlay";
  el.id = "overlay";
  var inner = document.createElement("div");
  inner.textContent = msg;
  el.appendChild(inner);
  document.body.appendChild(el);
}
function hideOverlay() {
  var el = document.getElementById("overlay");
  if (el) el.remove();
}
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 4500);
}

function applyState(s) {
  if (s && Array.isArray(s.guests)) state = s;
  loaded = true;
  if (meId && !state.guests.some(function (g) { return g.id === meId; })) setMe(null);
  render();
}

function act(promiseFactory, waitMsg) {
  if (busy) return;
  busy = true;
  render();
  overlay(waitMsg || "Une seconde… ✨");
  promiseFactory().then(function (result) {
    busy = false;
    hideOverlay();
    if (result && result.state) {
      if (result.meId) setMe(result.meId);
      applyState(result.state);
    } else {
      applyState(result);
    }
  }).catch(function (err) {
    busy = false;
    hideOverlay();
    render();
    toast((err && err.message ? err.message : "Oups, ça n'a pas marché — réessaie !").replace(/^(Error|Exception):\s*/, ""));
  });
}

function teamSegHtml(action, current) {
  var html = '<div class="teamseg" role="group" aria-label="Tu es plutôt…">';
  ["charlotte", "antoine", "deux"].forEach(function (k) {
    html += '<button type="button" class="' + TEAMS[k].cls + '" data-act="' + action +
      '" data-camp="' + k + '" aria-pressed="' + (current === k) + '">' + TEAMS[k].label + "</button>";
  });
  return html + "</div>";
}

function renderMe() {
  var me = meId ? state.guests.find(function (g) { return g.id === meId; }) : null;
  var html = "";

  if (me) {
    var team = TEAMS[me.camp] || TEAMS.deux;
    html += '<section class="card">';
    html += '<p class="hello">Salut ' + esc(me.name) + ' 👋</p>';
    html += '<p class="team ' + team.cls + '">' + team.label + "</p>";
    html += '<p class="question">Alors, tu viens le 17 octobre ?</p>';
    html += '<div class="big">';
    Object.keys(BIG).forEach(function (s) {
      html += '<button type="button" class="b-' + s + '" data-act="me-status" data-status="' + s +
        '" aria-pressed="' + (me.status === s) + '">' + BIG[s] + "</button>";
    });
    html += "</div>";
    html += '<p class="question">Tu es plutôt…</p>' + teamSegHtml("me-camp", me.camp);
    html += '<button type="button" class="linkbtn" data-act="not-me">Ce n’est pas moi</button>';
    html += "</section>";
    return html;
  }

  var q = norm(joinName);
  var ready = q.length >= 2;
  var matches = ready ? state.guests.filter(function (g) {
    return norm(g.name).indexOf(q) !== -1;
  }) : [];

  html += '<form class="card" data-form="join">';
  html += '<p class="cardtitle">Tu viens ? Dis-le-nous ! 💌</p>';
  html += '<input type="text" id="join-name" maxlength="60" placeholder="Ton prénom…" autocomplete="off" value="' + esc(joinName) + '">';
  if (!ready) {
    html += '<p class="hint">' + (q.length === 1
      ? "Encore une lettre… ✍️"
      : "Écris ton prénom, on s’occupe du reste 😊") + "</p>";
  } else {
    if (matches.length) {
      html += '<p class="chiplabel">C’est toi ? 👇</p>';
      html += '<div class="chips">';
      matches.forEach(function (g) {
        html += '<button type="button" data-act="pick-me" data-id="' + esc(g.id) + '">' + esc(g.name) + "</button>";
      });
      html += "</div>";
    }
    html += '<p class="question">' + (matches.length ? "Pas dans la liste ? Tu es plutôt…" : "Tu es plutôt…") + "</p>";
    html += teamSegHtml("join-camp", joinCamp);
    html += '<button type="submit" class="go">Je m’inscris 🎉</button>';
  }
  html += "</form>";
  return html;
}

function renderList() {
  var oui = state.guests.filter(function (g) { return g.status === "oui"; }).length;
  var maybe = state.guests.filter(function (g) { return g.status === "peutetre"; }).length;

  var html = '<section class="card">';
  html += '<div class="listhead"><h2>Qui vient ? 🎈</h2><span>' +
    state.guests.length + (state.guests.length > 1 ? " réponses" : " réponse") + "</span></div>";
  if (state.guests.length) {
    html += '<p class="moodline">🎉 ' + oui + " viennent" + (maybe ? " · 🤔 " + maybe + " peut-être" : "") + "</p>";
  }

  if (isAdmin) {
    html += '<form class="addform" data-form="add">';
    html += '<input type="text" id="guest-name" maxlength="60" placeholder="Ajouter quelqu’un…" autocomplete="off" value="' + esc(draftName) + '">';
    html += teamSegHtml("camp", draftCamp);
    html += '<button type="submit" class="go">Ajouter</button>';
    html += "</form>";
  }

  if (!state.guests.length) {
    html += '<p class="empty">Personne pour l’instant — sois le premier ou la première ! 🥳</p>';
  } else {
    html += '<ul class="guests">';
    state.guests.forEach(function (g) {
      var team = TEAMS[g.camp] || TEAMS.deux;
      html += '<li class="guest">';
      if (editingId === g.id && isAdmin) {
        html += '<form class="editrow" data-form="rename" data-id="' + esc(g.id) + '">';
        html += '<input type="text" maxlength="60" value="' + esc(g.name) + '" aria-label="Nouveau nom" data-edit-input>';
        html += '<button type="submit" class="ok">OK</button>';
        html += '<button type="button" class="no" data-act="cancel-edit">Annuler</button>';
        html += "</form>";
      } else {
        html += '<div class="gwho"><div class="gname">' + esc(g.name) +
          (g.id === meId ? " (toi)" : "") + '</div>' +
          '<div class="gteam ' + team.cls + '">' + team.label + "</div></div>";
        if (isAdmin) {
          html += '<div class="seg" role="group" aria-label="Statut de ' + esc(g.name) + '">';
          Object.keys(SEG).forEach(function (s) {
            html += '<button type="button" class="s-' + s + '" data-act="status" data-id="' + esc(g.id) +
              '" data-status="' + s + '" aria-pressed="' + (g.status === s) + '">' + SEG[s] + "</button>";
          });
          html += "</div>";
          html += '<div class="gtools">';
          html += '<button type="button" data-act="edit" data-id="' + esc(g.id) + '" aria-label="Renommer ' + esc(g.name) + '">✎</button>';
          if (armedDeleteId === g.id) {
            html += '<button type="button" class="armed" data-act="del" data-id="' + esc(g.id) + '">Supprimer ?</button>';
          } else {
            html += '<button type="button" data-act="del" data-id="' + esc(g.id) + '" aria-label="Supprimer ' + esc(g.name) + '">×</button>';
          }
          html += "</div>";
        } else {
          var st = MOODS[g.status] ? g.status : "peutetre";
          html += '<span class="mood p-' + st + '">' + MOODS[st] + "</span>";
        }
      }
      html += "</li>";
    });
    html += "</ul>";
  }
  html += "</section>";
  return html;
}

function render() {
  var app = document.getElementById("app");
  if (!loaded) return;
  var dl = daysLeft();

  var html = '<main class="wrap">';
  html += '<header class="hero">';
  html += '<div class="cake">🎂</div>';
  html += "<h1>Anniv Charlotte &amp; Antoine</h1>";
  html += '<p class="date">Samedi 17 octobre' +
    (dl > 0 ? ' <span class="jj">· dans ' + dl + " jours</span>" : dl === 0 ? ' <span class="jj">· c’est aujourd’hui !</span>' : "") + "</p>";
  html += "</header>";

  html += renderMe();
  html += renderList();

  html += '<footer class="foot">';
  if (state.updated) html += "<span>Dernière réponse le " + esc(fmtUpdated(state.updated)) + "</span>";
  if (isAdmin) {
    html += '<form class="adminbox" data-form="code">';
    html += '<input type="password" id="admin-newcode" minlength="4" maxlength="40" placeholder="Nouveau code" autocomplete="new-password">';
    html += '<button type="submit">Changer le code</button>';
    html += '<button type="button" class="quiet" data-act="admin-off">Quitter le mode orga</button>';
    html += "</form>";
  } else if (adminOpen) {
    html += '<form class="adminbox" data-form="unlock">';
    html += '<input type="password" id="admin-code" maxlength="40" placeholder="Code organisateurs" autocomplete="off">';
    html += '<button type="submit">Entrer</button>';
    html += '<button type="button" class="quiet" data-act="admin-close">Annuler</button>';
    html += "</form>";
  } else {
    html += '<button type="button" class="orga" data-act="admin-open">Espace organisateurs</button>';
  }
  html += "</footer></main>";

  app.innerHTML = html;
  var editInput = app.querySelector("[data-edit-input]");
  if (editInput) { editInput.focus(); editInput.select(); }
  if (adminOpen && !isAdmin) {
    var codeInput = document.getElementById("admin-code");
    if (codeInput) codeInput.focus();
  }
}

document.getElementById("app").addEventListener("click", function (ev) {
  var btn = ev.target.closest("[data-act]");
  if (!btn || busy) return;
  var actName = btn.getAttribute("data-act");
  var id = btn.getAttribute("data-id");
  if (actName === "admin-open") {
    adminOpen = true;
    render();
  } else if (actName === "admin-close") {
    adminOpen = false;
    render();
  } else if (actName === "admin-off") {
    isAdmin = false;
    adminOpen = false;
    adminCode = null;
    store("anniv-admin-code", null);
    editingId = null;
    armedDeleteId = null;
    render();
  } else if (actName === "pick-me") {
    setMe(id);
    render();
  } else if (actName === "not-me") {
    setMe(null);
    joinName = "";
    render();
  } else if (actName === "me-status") {
    var st = btn.getAttribute("data-status");
    act(function () { return run("apiSetSelf", meId, st, null); });
  } else if (actName === "me-camp") {
    var mc = btn.getAttribute("data-camp");
    act(function () { return run("apiSetSelf", meId, null, mc); });
  } else if (actName === "join-camp") {
    joinCamp = btn.getAttribute("data-camp");
    render();
    var ji = document.getElementById("join-name");
    if (ji) { ji.focus(); ji.setSelectionRange(ji.value.length, ji.value.length); }
  } else if (actName === "camp") {
    draftCamp = btn.getAttribute("data-camp");
    var ni = document.getElementById("guest-name");
    if (ni) draftName = ni.value;
    render();
    var back = document.getElementById("guest-name");
    if (back && draftName) back.focus();
  } else if (actName === "status") {
    if (!isAdmin) return;
    var s2 = btn.getAttribute("data-status");
    act(function () { return run("apiAdmin", adminCode, "status", { id: id, status: s2 }); });
  } else if (actName === "edit") {
    if (!isAdmin) return;
    editingId = id;
    armedDeleteId = null;
    render();
  } else if (actName === "cancel-edit") {
    editingId = null;
    render();
  } else if (actName === "del") {
    if (!isAdmin) return;
    if (armedDeleteId === id) {
      clearTimeout(armedTimer);
      armedDeleteId = null;
      editingId = null;
      act(function () { return run("apiAdmin", adminCode, "del", { id: id }); });
    } else {
      armedDeleteId = id;
      render();
      clearTimeout(armedTimer);
      armedTimer = setTimeout(function () {
        if (armedDeleteId === id) { armedDeleteId = null; render(); }
      }, 4000);
    }
  }
});

document.getElementById("app").addEventListener("input", function (ev) {
  var t = ev.target;
  if (!t) return;
  if (t.id === "guest-name") {
    draftName = t.value;
  } else if (t.id === "join-name") {
    joinName = t.value;
    var pos = t.selectionStart;
    render();
    var input = document.getElementById("join-name");
    if (input) { input.focus(); input.setSelectionRange(pos, pos); }
  }
});

document.getElementById("app").addEventListener("submit", function (ev) {
  var form = ev.target.closest("[data-form]");
  if (!form) return;
  ev.preventDefault();
  if (busy) return;
  var kind = form.getAttribute("data-form");
  if (kind === "unlock") {
    var input = document.getElementById("admin-code");
    var code = (input && input.value) || "";
    if (!code) return;
    act(function () {
      return run("apiVerifyAdmin", code).then(function (ok) {
        if (!ok) throw new Error("Code organisateurs incorrect.");
        isAdmin = true;
        adminOpen = false;
        adminCode = code;
        store("anniv-admin-code", code);
        return run("apiGetState");
      });
    }, "Vérification…");
  } else if (kind === "code") {
    if (!isAdmin) return;
    var nc = document.getElementById("admin-newcode");
    var newCode = ((nc && nc.value) || "").trim();
    if (newCode.length < 4) { toast("Le code doit faire au moins 4 caractères."); return; }
    act(function () {
      return run("apiAdmin", adminCode, "code", { code: newCode }).then(function (s) {
        adminCode = newCode;
        store("anniv-admin-code", newCode);
        toast("Code organisateurs changé ✔");
        return s;
      });
    });
  } else if (kind === "join") {
    var name = joinName.trim();
    if (norm(name).length < 2) { toast("Écris ton prénom (au moins 2 lettres) !"); return; }
    act(function () { return run("apiJoin", name, joinCamp); }, "Inscription… 🎉");
  } else if (kind === "add") {
    if (!isAdmin) return;
    var gname = (document.getElementById("guest-name").value || "").trim();
    if (!gname) { toast("Il manque le prénom !"); return; }
    var camp = draftCamp;
    draftName = "";
    act(function () { return run("apiAdmin", adminCode, "add", { name: gname, camp: camp }); });
  } else if (kind === "rename") {
    if (!isAdmin) return;
    var rid = form.getAttribute("data-id");
    var rin = form.querySelector("[data-edit-input]");
    var rname = (rin.value || "").trim();
    if (!rname) { toast("Le nom ne peut pas être vide."); return; }
    editingId = null;
    act(function () { return run("apiAdmin", adminCode, "rename", { id: rid, name: rname }); });
  }
});

meId = read("anniv-me");
var storedCode = read("anniv-admin-code");

run("apiGetState").then(function (s) {
  applyState(s);
  if (storedCode) {
    run("apiVerifyAdmin", storedCode).then(function (ok) {
      if (ok) { isAdmin = true; adminCode = storedCode; }
      else store("anniv-admin-code", null);
      render();
    });
  }
}).catch(function () {
  document.getElementById("app").innerHTML =
    '<p class="loading">Impossible de charger la liste — recharge la page 🙏</p>';
});

setInterval(function () {
  if (busy || document.hidden || !loaded) return;
  run("apiGetState").then(function (s) {
    if (!busy) applyState(s);
  }).catch(function () {});
}, 45000);
</script>
</body>
</html>
